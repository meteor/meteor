# Labels of meteor/meteor, applied by .github/workflows/labels.yml.
# Change labels here, not in the repository settings: a label missing from this
# file is deleted. `from_name` renames an existing label and keeps its history;
# remove the line once the rename is done, or later changes to that label are skipped.
# Keep one quoted key per line, without a trailing comment: the migration scripts
# read the names and the renames line by line.
# What each facet means and who applies it: LABELS.md.

# type: exactly one per item
- name: "type: bug"
  color: "d73a4a"
  description: "Something does not work as documented or as it used to"
  from_name: "Type:Bug"
- name: "type: feature"
  color: "a2eeef"
  description: "New behavior or capability"
  from_name: "Type:Feature"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation is missing, wrong or unclear"
  from_name: "missing-docs"
- name: "type: maintenance"
  color: "bfd4f2"
  description: "Repository chores: CI, tooling, dependencies, refactors without behavior change"
- name: "type: security"
  color: "b60205"
  description: "Security hardening; report vulnerabilities privately, see SECURITY.md"

# area: one or more per item, applied by .github/labeler.yml on pull requests
- name: "area: accounts"
  color: "1d76db"
  description: "Accounts, password, passwordless, 2FA, OAuth and login services, roles"
  from_name: "Project:Accounts:Password"
- name: "area: blaze"
  color: "1d76db"
  description: "Blaze integration in this repository (Blaze itself lives in meteor/blaze)"
  from_name: "Project:blaze"
- name: "area: build"
  color: "1d76db"
  description: "Isobuild, compilers, minifiers, modules, HMR, CSS, Babel and SWC"
  from_name: "Project:Isobuild"
- name: "area: cli"
  color: "1d76db"
  description: "The meteor command: tool, shell, installer and version solver"
  from_name: "Project:Tool"
- name: "area: core"
  color: "1d76db"
  description: "Runtime packages: meteor, core-runtime, EJSON, check, logging, random"
  from_name: "Project:EJSON"
- name: "area: create"
  color: "1d76db"
  description: "meteor create, skeletons and example apps"
  from_name: "Project:Examples"
- name: "area: ddp"
  color: "1d76db"
  description: "DDP client and server, transports, methods and subscriptions"
  from_name: "Project:DDP"
- name: "area: docs"
  color: "1d76db"
  description: "Changes the docs or the guide and nothing else"
  from_name: "Project:Docs"
- name: "area: instrumentation"
  color: "1d76db"
  description: "Instrumentation and OpenTelemetry (roadmap front, folds into core afterwards)"
- name: "area: livequery"
  color: "1d76db"
  description: "Oplog, change streams and the observe drivers"
  from_name: "Project:Livequery"
- name: "area: minimongo"
  color: "1d76db"
  description: "Minimongo: client collections, selectors, modifiers, observe"
  from_name: "Project:Minimongo"
- name: "area: mobile"
  color: "1d76db"
  description: "Cordova, Capacitor, iOS and Android builds"
  from_name: "Project:Mobile"
- name: "area: mongo"
  color: "1d76db"
  description: "Mongo collections and driver, allow/deny, npm-mongo"
  from_name: "Project:Mongo Driver"
- name: "area: offline"
  color: "1d76db"
  description: "Offline package and PWA skeleton (roadmap front, folds into webapp afterwards)"
- name: "area: packages"
  color: "1d76db"
  description: "Other core packages: email, fetch, url, imported packages"
  from_name: "Project:Utilities:Email"
- name: "area: reactivity"
  color: "1d76db"
  description: "Tracker, reactive-var, reactive-dict, session"
- name: "area: release"
  color: "1d76db"
  description: "Release process, packaging and version bumps"
  from_name: "Project:Release Process"
- name: "area: rspack"
  color: "1d76db"
  description: "Rspack bundler integration (the modern build stack)"
  from_name: "modern-build-stack"
- name: "area: testing"
  color: "1d76db"
  description: "Test harness: tinytest, test-in-*, e2e (not the self-tests of a CLI change)"
  from_name: "Project:Testing"
- name: "area: types"
  color: "1d76db"
  description: "TypeScript declarations and type tests"
  from_name: "Project:JS Environment:Typescript"
- name: "area: webapp"
  color: "1d76db"
  description: "Webapp, boilerplate, browser policy, autoupdate, server rendering"
  from_name: "Project:Webapp"

# platform: only when the item is specific to an operating system
- name: "platform: windows"
  color: "5319e7"
  description: "Specific to Windows"
  from_name: "Project:Windows"

# status: exactly one per open issue
- name: "status: needs-triage"
  color: "fbca04"
  description: "New, not looked at yet (set by the issue template)"
  from_name: "triage"
- name: "status: needs-reproduction"
  color: "fbca04"
  description: "A minimal reproduction is needed before anyone can work on it"
  from_name: "needs-reproduction"
- name: "status: needs-info"
  color: "fbca04"
  description: "Waiting for information from the author"
  from_name: "not-ready"
- name: "status: confirmed"
  color: "fbca04"
  description: "Reproduced or accepted; the cause or the design is still open"
  from_name: "confirmed"
- name: "status: in-discussion"
  color: "fbca04"
  description: "The approach is still being discussed"
  from_name: "in-discussion"
- name: "status: ready"
  color: "fbca04"
  description: "Clear and accepted, nobody on it yet: pick it up"
  from_name: "ready"
- name: "status: in-progress"
  color: "fbca04"
  description: "Someone is working on it"
  from_name: "in-development"
- name: "status: blocked"
  color: "fbca04"
  description: "Waiting on something else: a release, another PR or a decision"
  from_name: "pending-tests"
- name: "status: stale"
  color: "fbca04"
  description: "No human comment for 90 days (weekly script, removed after a human comment)"
  from_name: "idle"

# legacy: issues reported on releases before 3.0, until someone checks them on 3.x
- name: "legacy: needs-review"
  color: "c5def5"
  description: "May only affect releases before 3.0: someone needs to check it on 3.x"
- name: "legacy: pre-3 only"
  color: "c5def5"
  description: "Confirmed to affect only releases before 3.0; closed as not planned"

# priority: set by the Meteor Software team, it is their roadmap
- name: "priority: critical"
  color: "d93f0b"
  description: "Breaks production apps or every user; may justify a backport"
  from_name: "Severity:production"
- name: "priority: next"
  color: "d93f0b"
  description: "Planned for the next releases"
  from_name: "Next 3.x.x"
- name: "priority: candidate"
  color: "d93f0b"
  description: "Considered for the roadmap, not committed yet"
  from_name: "Candidate 3.x.x"
- name: "priority: low"
  color: "d93f0b"
  description: "Valid, but not soon"

# Standalone labels, outside the facets
- name: "experimental"
  color: "d4c5f9"
  description: "Exploration or proof of concept, no commitment to adopt it; combines with any facet"
- name: "good first issue"
  color: "3e5fa3"
  description: "Good first contribution for someone new to the codebase"
- name: "help wanted"
  color: "128A0C"
  description: "Accepted and open to community contributions"
- name: "hacktoberfest-accepted"
  color: "7010b5"
  description: "Accepted for Hacktoberfest (required by the program rules)"
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"
