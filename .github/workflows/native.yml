name: Native mobile smoke tests

on:
  push:
    branches: [ci/release-3.6.2]
    paths:
      - '.github/workflows/native.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36a5f74cdd216e936d1f2a306fc534a9c3dbe9b0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install root deps
        run: npm ci
      - name: Install native-tests deps
        run: npm run install:native
      - name: Run smoke flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect
          script: npm run test:native -- --platform=android
      - name: Upload JUnit and device logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-android-${{ github.run_id }}
          path: tools/native-tests/junit/

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36a5f74cdd216e936d1f2a306fc534a9c3dbe9b0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install root deps
        run: npm ci
      - name: Install native-tests deps
        run: npm run install:native
      - name: Prepare the dev bundle and smoke app dependencies
        run: |
          app_dir=$(mktemp -d)
          cp -R tools/native-tests/apps/smoke/. "$app_dir/"
          cd "$app_dir"
          "$GITHUB_WORKSPACE/meteor" npm install
          "$GITHUB_WORKSPACE/meteor" --prepare-app
      - name: Pre-boot iOS Simulator
        run: |
          if ! xcrun simctl list devices available | grep -Fq "iPhone 15 ("; then
            runtime=$(xcrun simctl list runtimes --json | jq -er '[.runtimes[] | select(.isAvailable and (.identifier | contains(".iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | last.identifier')
            xcrun simctl create "iPhone 15" com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$runtime"
          fi
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus "iPhone 15" -b
      - name: Run smoke flow on iOS Simulator
        run: npm run test:native -- --platform=ios
      - name: Upload JUnit and device logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-${{ github.run_id }}
          path: tools/native-tests/junit/
