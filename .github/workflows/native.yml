name: Native mobile tests

on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [labeled]

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: ${{ matrix.scenario == 'run' && 'android' || 'android (blaze livereload)' }}
    if: github.event_name == 'schedule' || github.event.label.name == 'mobile'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: run
            command: npm run test:native -- --platform=android
          - scenario: livereload-blaze
            command: npm run test:native:capacitor:android:livereload:blaze
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install root deps
        run: npm ci
      - name: Install native-tests deps
        run: npm run install:native
      - name: Run native tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect
          script: ${{ matrix.command }}
      - name: Upload JUnit and device logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scenario == 'run' && 'native-android' || 'native-android-blaze-livereload' }}-${{ github.run_id }}
          path: tools/native-tests/junit/

  ios:
    name: ${{ matrix.scenario == 'run' && 'ios' || 'ios (blaze livereload)' }}
    if: github.event_name == 'schedule' || github.event.label.name == 'mobile'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: run
            command: npm run test:native -- --platform=ios
          - scenario: livereload-blaze
            command: npm run test:native:capacitor:ios:livereload:blaze
    timeout-minutes: 30
    env:
      MAESTRO_IOS_DEVICE: iPhone 17
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install root deps
        run: npm ci
      - name: Install native-tests deps
        run: npm run install:native
      - name: Pre-boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 17" || true
          xcrun simctl bootstatus "iPhone 17" -b
      - name: Run native tests on iOS Simulator
        run: ${{ matrix.command }}
      - name: Upload JUnit and device logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scenario == 'run' && 'native-ios' || 'native-ios-blaze-livereload' }}-${{ github.run_id }}
          path: tools/native-tests/junit/
