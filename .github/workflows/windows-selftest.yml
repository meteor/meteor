name: Windows Selftest

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'meteor'
      - 'meteor.bat'
      - 'tools/**'
      - '!tools/e2e-tests/**'
      - 'packages/babel-compiler/**'
      - 'packages/dynamic-import/**'
      - 'packages/meteor/**'
      - 'packages/meteor-tool/**'
      - '.github/workflows/windows-selftest.yml'

  push:
    branches:
      - codex/mongodb8-bundle-validation
      - devel

env:
  USE_TEST_DEV_BUNDLE_SERVER: "1"
  # npm submits an audit request with every install. Meteor runs many installs
  # when caches are cold, and this workflow does not consume their automatic
  # audit reports. Avoid making CI reliability depend on npm's audit endpoint.
  npm_config_audit: "false"
  METEOR_PRETTY_OUTPUT: 0
  SELF_TEST_TOOL_NODE_FLAGS: ' '
  TOOL_NODE_FLAGS: --expose-gc
  TIMEOUT_SCALE_FACTOR: 20
  METEOR_HEADLESS: true
  SELF_TEST_EXCLUDE: '^NULL-LEAVE-THIS-HERE-NULL$'
  METEOR_MODERN: true

jobs:
  test:
    runs-on: windows-2022
    concurrency:
      group: mongodb8-windows-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Cleanup
        shell: powershell
        run: Remove-Item -Recurse -Force ${{ github.workspace }}\*

      - name: Enable Git Symlinks
        shell: powershell
        run: git config --global core.symlinks true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Cache dependencies
        id: meteor-cache
        uses: actions/cache@v4
        with:
          path: |
            dev_bundle/
            .babel-cache/
            .meteor/
            ~/.npm
            node_modules/
            packages/**/.npm
          key: ${{ runner.os }}-node-26-meteor-${{ hashFiles('meteor', 'meteor.bat') }}
          restore-keys: |
            ${{ runner.os }}-node-26-meteor-

      - name: Reset submodules (force refetch)
        shell: pwsh
        run: |
          git submodule deinit -f --all
          if (Test-Path ".git/modules") { Remove-Item -Recurse -Force ".git/modules" }

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\7-Zip;$env:PATH"
          .\scripts\windows\ci\install.ps1

      - name: Verify MongoDB 8 test bundle
        shell: pwsh
        run: |
          .\meteor.bat node --version
          if ($LASTEXITCODE -ne 0) { throw "Could not install test bundle" }
          $version = & .\dev_bundle\mongodb\bin\mongod.exe --version
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch 'db version v8\.0\.29') { throw "Expected MongoDB 8.0.29" }
          $version

      # Run ONLY when the cache was NOT restored
      - name: Prepare Meteor (cache miss)
        if: steps.meteor-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\7-Zip;$env:PATH"
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Running meteor --get-ready (attempt $attempt of $maxAttempts)..."
            .\meteor.bat --get-ready
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "meteor --get-ready failed after $maxAttempts attempts."
            }

            Write-Warning "meteor --get-ready failed with exit code $LASTEXITCODE; retrying."
            Start-Sleep -Seconds 5
          }

      - name: Run tests
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\7-Zip;$env:PATH"
          .\scripts\windows\ci\test.ps1
