name: Unit Tests

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'scripts/**'
      - 'packages/rstest/**'
      - 'packages/rspack/**'
      - 'packages/tools-core/**'
      - 'packages/babel-compiler/**'
      - 'npm-packages/meteor-rstest/**'
      - 'npm-packages/meteor-rspack/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unit-tests.yml'
  push:
    branches:
      - devel

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install unit test deps
        run: npm run install:unit

      - name: Run unit tests
        run: npm run test:unit

  rstest:
    name: Rstest and Rspack unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install repository dependencies
        run: npm ci
      - name: Install local integration dependencies
        run: |
          npm ci --prefix npm-packages/meteor-rspack
          npm ci --prefix npm-packages/meteor-rstest --legacy-peer-deps
          npm install --prefix npm-packages/meteor-rstest --no-save --package-lock=false --install-links=false ./npm-packages/meteor-rspack
          npm run install:unit
          npm ci --prefix tools/e2e-tests
      - name: Run provider, runtime, bundler, and coverage tests
        run: npm run test:rstest
