name: Unit Tests

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'scripts/**'
      # testMatch also covers this package, so a PR that only touches it must
      # still run the suite.
      - 'npm-packages/meteor-rspack/**'
      - 'packages/rspack/**'
      - 'packages/tools-core/**'
      - 'npm-packages/meteor-rspack/**'
      - 'package.json'
      - '.github/workflows/unit-tests.yml'
  push:
    branches:
      - devel

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    uses: ./.github/workflows/linux-check.yml
    with:
      image: node:26-bookworm
      command: |
        npm run install:unit
        npm run test:unit
