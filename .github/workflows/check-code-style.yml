name: Check code-style
on:
  push:
    branches: [ci/release-3.6.2]
    paths:
      - '.github/workflows/check-code-style.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-code-style:
    runs-on: oss-vm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36a5f74cdd216e936d1f2a306fc534a9c3dbe9b0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
      - run: npm ci
      - name: Check formatting with oxfmt
        run: npx oxfmt --ignore-path .fmtignore --check .
      - name: Run lint with oxlint
        run: npm run lint
