name: Check code-style
on:
  push:
    paths:
      - 'packages/**'
      - 'npm-packages/meteor-installer/**'
  pull_request:
    paths:
      - 'packages/**'
      - 'npm-packages/meteor-installer/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-code-style:
    uses: ./.github/workflows/linux-check.yml
    with:
      image: node:26-bookworm
      command: |
        npm ci
        npx oxfmt --ignore-path .fmtignore --check .
        npm run lint
