name: Check code-style
on:
  push:
    paths:
      - 'packages/**'
      - 'npm-packages/meteor-installer/**'
      - 'npm-packages/meteor-rstest/**'
      - '.fmtignore'
      - '.oxlintignore'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.github/workflows/check-code-style.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'packages/**'
      - 'npm-packages/meteor-installer/**'
      - 'npm-packages/meteor-rstest/**'
      - '.fmtignore'
      - '.oxlintignore'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.github/workflows/check-code-style.yml'
      - 'package.json'
      - 'package-lock.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-code-style:
    runs-on: oss-vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - name: Check formatting with oxfmt
        run: npx oxfmt --ignore-path .fmtignore --check .
      - name: Run lint with oxlint
        run: npm run lint
