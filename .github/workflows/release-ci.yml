name: Release CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
  test-tools:
    uses: ./.github/workflows/test-tools.yml
  windows-selftest:
    uses: ./.github/workflows/windows-selftest.yml
  test-packages:
    uses: ./.github/workflows/test-packages.yml
