name: Type Coverage
on:
  pull_request:
  workflow_dispatch:
jobs:
  type-coverage:
    runs-on: oss-vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - run: npm ci
      - name: Check TypeScript type coverage (80%)
        run: npm run ts-coverage:ci
