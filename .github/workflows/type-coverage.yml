name: Type Coverage
on:
  push:
    branches: [ci/release-3.6.2]
    paths:
      - '.github/workflows/type-coverage.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  type-coverage:
    runs-on: oss-vm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36a5f74cdd216e936d1f2a306fc534a9c3dbe9b0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
      - run: npm ci
      - name: Type compilation
        run: npm run types:compile
      - name: Type tests
        run: npm run types:test
      - name: Type breadth tests
        run: npm run types:breadth:test
      - name: Type breadth
        run: npm run types:breadth
      - name: Type coverage (99%)
        run: npm run types:coverage
      - name: Type test coverage (100%)
        run: npm run types:dts-test-coverage
