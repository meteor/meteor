name: Type Coverage
on:
  - pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-coverage:
    uses: ./.github/workflows/run-linux-check-in-docker.yml
    with:
      image: node:26-bookworm
      npm-lockfile: package-lock.json
      command: |
        npm ci --prefer-offline
        npm run types:compile
        npm run types:test
        npm run types:breadth:test
        npm run types:breadth
        npm run types:coverage
        npm run types:dts-test-coverage
