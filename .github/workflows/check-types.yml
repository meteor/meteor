name: Check type declarations
on:
  pull_request:
    paths:
      - 'packages/**/*.ts'
      - 'packages/**/package-types.json'
      - 'scripts/test-types.mjs'
jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run test:types
