name: Test Packages

on:
  push:
    branches: [ci/release-3.6.2]
    paths:
      - '.github/workflows/test-packages.yml'

jobs:
  test-packages:
    strategy:
      fail-fast: false
      matrix:
        reactivity_order:
          - 'changeStreams,polling'
          - 'oplog,polling'
    runs-on: oss-vm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.reactivity_order }}
      cancel-in-progress: true
    timeout-minutes: 90
    env:
      # npm submits an audit request with every install. Meteor can run many
      # installs when caches are cold, and this job does not consume their
      # automatic audit reports.
      npm_config_audit: "false"
      CXX: g++-12
      phantom: false
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI
      METEOR_REACTIVITY_ORDER: ${{ matrix.reactivity_order }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 36a5f74cdd216e936d1f2a306fc534a9c3dbe9b0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-node-26-meteor-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-26-meteor-
      - name: Run test-in-console suite
        run: |
          export TEST_PACKAGES_EXCLUDE="stylus"
          export METEOR_MODERN="true"
          export NODE_ENV="CI"
          export CXX="g++-12"
          export phantom="false"
          export TIMEOUT_SCALE_FACTOR="20"
          export METEOR_HEADLESS="true"
          ./packages/test-in-console/run.sh

  deprecated-packages:
    name: Test Deprecated Packages
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-test-deprecated-packages
      cancel-in-progress: true
    timeout-minutes: 60

    env:
      PUPPETEER_DOWNLOAD_PATH: /home/runner/.npm/chromium

    steps:
      - name: Update and install dependencies
        run: sudo apt-get update && sudo apt-get install -y libnss3 g++-12

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 36a5f74cdd216e936d1f2a306fc534a9c3dbe9b0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.1

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
            /home/runner/.npm/chromium
          key: ${{ runner.os }}-node-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: ./packages/test-in-console/run.sh
