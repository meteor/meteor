name: Test Packages

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/test-packages.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CXX: g++-12
  METEOR_HOSTED_CI: "true"
  METEOR_MODERN: true
  CXX: g++-12
  METEOR_ALLOW_SUPERUSER: 1


jobs:
  # ─── Setup ────────────────────────────────────────────────────────────────────
  # Prepares the Meteor environment and populates the cache so all parallel
  # package test jobs get a cache hit and skip the slow --get-ready step.
  setup:
    name: Setup
    runs-on: oss-vm
    container:
      image: meteor/circleci:2025.07.8-android-35-node-22
      options: --user root
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose globally-installed puppeteer to Node.js
        # puppeteer is pre-installed on oss-vm via `npm install -g`.
        # Setting NODE_PATH lets `require('puppeteer')` resolve it directly,
        # so run.sh skips the slow `./meteor npm install -g puppeteer` step.
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Restore caches
        id: meteor-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
            packages/**/.npm
          key: ${{ runner.os }}-meteor-packages-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-meteor-packages-
            ${{ runner.os }}-meteor-

      - name: Prepare Meteor
        if: steps.meteor-cache.outputs.cache-hit != 'true'
        timeout-minutes: 65
        run: ./meteor --get-ready

  # ─── Package Group: accounts ──────────────────────────────────────────────────
  packages-accounts:
    name: "packages / accounts"
    runs-on: oss-vm
    container:
      image: meteor/circleci:2025.07.8-android-35-node-22
      options: --user root
    needs: setup
    timeout-minutes: 45
    env:
      PACKAGES: >-
        accounts-base accounts-password accounts-passwordless accounts-2fa
        accounts-oauth accounts-ui-unstyled check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose globally-installed puppeteer to Node.js
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
            packages/**/.npm
          key: ${{ runner.os }}-meteor-packages-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-meteor-packages-
            ${{ runner.os }}-meteor-

      - name: Log environment
        run: |
          lsb_release -a
          uname -srm
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Meteor Node: $(./meteor node --version)"
          echo "Meteor NPM: $(./meteor npm --version)"

      - name: Run package tests (accounts)
        run: ./packages/test-in-console/run.sh "$PACKAGES"

