name: Test Packages

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/test-packages.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-packages:
    runs-on: oss-vm
    timeout-minutes: 90
    env:
      CXX: g++-12
      phantom: false
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI

    steps:
      - name: Fix workspace permissions
        # Self-hosted runners may retain files owned by previous runs as root.
        run: sudo chown -R "$(id -un):$(id -gn)" "$GITHUB_WORKSPACE" || true
        working-directory: /tmp

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-node-22.17-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.17-

      - name: Install system dependencies
        # Only g++-12 is needed for building native Node.js add-ons.
        # Chrome and all its Chromium system libs are provided by the
        # ghcr.io/puppeteer/puppeteer Docker image used in run.sh.
        run: |
          if ! dpkg -s g++-12 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y g++-12
          fi

      - name: Install npm dependencies
        run: npm install

      - name: Run test-in-console suite
        run: ./packages/test-in-console/run.sh
