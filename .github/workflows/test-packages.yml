name: Test Packages

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/test-packages.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-packages:
    runs-on: oss-vm
    timeout-minutes: 90
    env:
      CXX: g++-12
      phantom: false
      # Chrome is downloaded here by run.sh via `./meteor npm install -g puppeteer`.
      # This path is cached across runs to avoid re-downloading on every run.
      PUPPETEER_DOWNLOAD_PATH: /home/ubuntu/.npm/chromium
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI

    steps:
      - name: Fix workspace permissions
        # Self-hosted runners may retain files owned by previous runs as root.
        run: sudo chown -R "$(id -un):$(id -gn)" "$GITHUB_WORKSPACE" || true
        working-directory: /tmp

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Restore caches
        # /home/ubuntu/.npm/chromium matches PUPPETEER_DOWNLOAD_PATH — caches the Chrome binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
            /home/ubuntu/.npm/chromium
          key: ${{ runner.os }}-node-22.17-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.17-

      - name: Install system dependencies
        run: |
          PKGS="g++-12 \
            libatk-bridge2.0-0 libatk1.0-0t64 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 \
            libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 \
            libasound2t64"
          if dpkg -s $PKGS >/dev/null 2>&1; then
            echo "All system dependencies already installed, skipping."
          else
            sudo apt-get update
            sudo apt-get install -y $PKGS
          fi

      - name: Install npm dependencies
        run: npm install

      - name: Run test-in-console suite
        run: ./packages/test-in-console/run.sh
