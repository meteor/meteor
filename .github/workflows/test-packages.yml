name: Test Packages

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/test-packages.yml"

jobs:
  test-packages:
    strategy:
      fail-fast: false
    runs-on: oss-vm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 90
    env:
      CXX: g++-12
      phantom: false
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI

    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -un):$(id -gn)" "$GITHUB_WORKSPACE" || true
        working-directory: /tmp

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
            ~/.cache/puppeteer
          key: ${{ runner.os }}-node-22.17-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.17-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12

      - name: Install Puppeteer browser with system dependencies
        run: npx puppeteer@23.6.0 browsers install chrome --with-deps

      - name: Install npm dependencies
        run: npm install

      - name: Run test-in-console suite
        run: ./packages/test-in-console/run.sh
