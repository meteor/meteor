name: Test Packages

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/test-packages.yml"

permissions:
  contents: read

jobs:
  test-packages:
    strategy:
      fail-fast: false
      matrix:
        reactivity_order:
          - 'changeStreams,polling'
          - 'oplog,polling'
    runs-on: >-
      ${{ github.repository == 'meteor/meteor'
          && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-latest'
          || fromJSON(format('["self-hosted","linux",{0}]', toJSON(
               github.event.pull_request.head.repo.full_name != github.repository
               && (vars.METEOR_CI_FORK_LINUX_RUNNER || 'meteor-fork-ci')
               || vars.METEOR_CI_LINUX_RUNNER || 'oss-vm'))) }}
    defaults:
      run:
        working-directory: .ci-packages
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.reactivity_order }}
      cancel-in-progress: true
    timeout-minutes: 90
    env:
      # npm submits an audit request with every install. Meteor can run many
      # installs when caches are cold, and this job does not consume their
      # automatic audit reports.
      npm_config_audit: "false"
      CXX: g++-12
      phantom: false
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI
      METEOR_REACTIVITY_ORDER: ${{ matrix.reactivity_order }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Container jobs can leave root-owned files in the shared workspace.
          path: .ci-packages
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Use job-local npm and test directories
        run: |
          mkdir -p "$RUNNER_TEMP/meteor-tests"
          echo "npm_config_cache=$RUNNER_TEMP/meteor-npm" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/meteor-tests" >> "$GITHUB_ENV"

      - name: Restore caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: &cache-paths |
            ${{ runner.temp }}/meteor-npm/_cacache
            .ci-packages/.meteor
            .ci-packages/.babel-cache
            .ci-packages/dev_bundle
          key: ${{ runner.os }}-node-26-meteor-${{ hashFiles('.ci-packages/meteor', '.ci-packages/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-26-meteor-

      - name: Ensure unzip is available for Puppeteer
        run: |
          if ! command -v unzip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y unzip
          fi

      - name: Run test-in-console suite
        run: |
          export TEST_PACKAGES_EXCLUDE="stylus"
          export METEOR_MODERN="true"
          export NODE_ENV="CI"
          export CXX="g++-12"
          export phantom="false"
          export TIMEOUT_SCALE_FACTOR="20"
          export METEOR_HEADLESS="true"
          ./packages/test-in-console/run.sh

      - name: Save caches
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Remove package test checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- .ci-packages
