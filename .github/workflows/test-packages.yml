name: Test Packages

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/test-packages.yml"



jobs:
  test-packages:
    strategy:
      fail-fast: false
      matrix:
        reactivity_order:
          - 'changeStreams,polling'
          - 'oplog,polling'
    runs-on: oss-vm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.reactivity_order }}
      cancel-in-progress: true
    timeout-minutes: 90
    env:
      CXX: g++-12
      phantom: false
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI
      METEOR_REACTIVITY_ORDER: ${{ matrix.reactivity_order }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          submodules: recursive

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-node-26-meteor-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-26-meteor-
      - name: Run test-in-console suite
        run: |
          export TEST_PACKAGES_EXCLUDE="stylus"
          export METEOR_MODERN="true"
          export NODE_ENV="CI"
          export CXX="g++-12"
          export phantom="false"
          export TIMEOUT_SCALE_FACTOR="20"
          export METEOR_HEADLESS="true"
          ./packages/test-in-console/run.sh
