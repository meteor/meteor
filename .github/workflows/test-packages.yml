name: Test Packages

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/test-packages.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-key:
    runs-on: oss-vm
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute hash
        id: hash
        run: echo "hash=${{ hashFiles('meteor', '**/package-lock.json') }}" >> "$GITHUB_OUTPUT"

  test-packages:
    needs: cache-key
    runs-on: oss-vm
    timeout-minutes: 90
    container:
      image: node:22-bookworm
      options: --shm-size=2gb
      volumes:
        - /cache/meteor/${{ needs.cache-key.outputs.hash }}/npm:/root/.npm
        - /cache/meteor/${{ needs.cache-key.outputs.hash }}/dev-bundle:/github/workspace/dev_bundle
        - /cache/meteor/${{ needs.cache-key.outputs.hash }}/dot-meteor:/github/workspace/.meteor
        - /cache/meteor/${{ needs.cache-key.outputs.hash }}/babel:/github/workspace/.babel-cache
        - /cache/meteor/${{ needs.cache-key.outputs.hash }}/puppeteer:/root/.npm/chromium
    env:
      CXX: g++-12
      phantom: false
      PUPPETEER_DOWNLOAD_PATH: /root/.npm/chromium
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI
      METEOR_ALLOW_SUPERUSER: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            g++-12 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libasound2

      - name: Install npm dependencies
        run: npm install

      - name: Run test-in-console suite
        run: ./packages/test-in-console/run.sh
