name: Manual Runner Cleanup

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'The runner label to run the cleanup on (e.g., oss-vm)'
        required: true
        default: 'oss-vm'
        type: string
      min_free_gb:
        description: 'Minimum free disk space in GiB. If free space is below this, Docker prune will run.'
        required: true
        default: '20'
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup (${{ inputs.runner_label }})
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run runner cleanup
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SELF_HOSTED_MIN_FREE_GB: ${{ inputs.min_free_gb }}
        with:
          script: |
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ".github/scripts/run-self-hosted-runner-cleanup.js",
              ref: context.sha,
            });
            const loaderSource = data.content.replace(/\n/g, "");
            await (await import(`data:text/javascript;base64,${loaderSource}`)).default({
              github,
              context,
            });
