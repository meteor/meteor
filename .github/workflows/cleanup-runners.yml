name: Manual Runner Cleanup

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Optional extra label for one machine in the configured Linux pool. Leave blank for any available worker.'
        required: false
        type: string
      min_free_gb:
        description: 'Required free GiB on the workspace and Docker filesystems after cleanup. Use 0 for workspace cleanup only.'
        required: true
        default: '20'
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    name: Clean runner workspace and Docker storage
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && github.ref_protected
    # Labels are cumulative. A machine-specific label must still match the repository's pool.
    runs-on:
      - self-hosted
      - linux
      - ${{ vars.METEOR_CI_LINUX_RUNNER || 'oss-vm' }}
      - ${{ inputs.runner_label || 'self-hosted' }}
    steps:
      - name: Run runner cleanup
        uses: actions/github-script@v9
        env:
          SELF_HOSTED_MIN_FREE_GB: ${{ inputs.min_free_gb }}
        with:
          script: |
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ".github/scripts/run-self-hosted-runner-cleanup.js",
              ref: context.sha,
            });
            const loaderSource = data.content.replace(/\n/g, "");
            await (await import(`data:text/javascript;base64,${loaderSource}`)).default({
              github,
              context,
            });
