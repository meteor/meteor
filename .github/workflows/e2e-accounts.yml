name: E2E Accounts

on:
  pull_request:
    paths:
      - 'meteor'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/accounts-*/**'
      - 'tools/e2e-tests/package*.json'
      - 'tools/e2e-tests/jest*.js'
      - 'tools/e2e-tests/helpers.js'
      - 'tools/e2e-tests/test-groups.js'
      - 'tools/e2e-tests/scripts/**'
      - 'tools/e2e-tests/accounts.test.js'
      - 'tools/e2e-tests/apps/accounts/**'
      - 'tools/e2e-tests/helpers/accounts-helpers.js'
      - '.github/workflows/e2e-accounts.yml'
      - '.github/actions/prepare-e2e/**'
  push:
    branches:
      - 'release-*'

permissions:
  contents: read

concurrency:
  group: meteor-e2e-accounts-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOL_NODE_FLAGS: "--max_old_space_size=12288"
  # Force "localhost" to resolve to 127.0.0.1; runner prefers ::1, which
  # breaks local proxies to IPv4-only dev servers (ECONNREFUSED).
  NODE_OPTIONS: "--max_old_space_size=16384 --dns-result-order=ipv4first"
  # npm submits an audit request with every install. Meteor runs many installs
  # when caches are cold, and this workflow does not consume their automatic
  # audit reports. Avoid making E2E reliability depend on npm's audit endpoint.
  npm_config_audit: "false"
  # Per-test Jest retry count. Consumed by tools/e2e-tests/jest.setup.js.
  METEOR_E2E_TEST_RETRIES: 1

jobs:
  test:
    name: Accounts
    runs-on: >-
      ${{ github.repository == 'meteor/meteor'
          && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && 'ubuntu-latest'
          || fromJSON(format('["self-hosted","linux",{0}]', toJSON(
               (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
               && (vars.METEOR_CI_FORK_LINUX_RUNNER || 'meteor-fork-ci')
               || vars.METEOR_CI_LINUX_RUNNER || 'oss-vm'))) }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci-e2e
    container:
      image: node:22-bookworm
      # --init runs tini as PID 1 so orphaned processes get reaped. Without it
      # the container's PID 1 is `tail -f /dev/null`, which never calls wait(),
      # leaving every orphan (chrome, mongod, sh, ...) as a permanent zombie.
      # A quota caps CPU time and lets Docker start the job on smaller runners.
      options: --init --cpu-period 100000 --cpu-quota 600000 --memory 16g --security-opt seccomp=unconfined

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ci-e2e
          submodules: recursive
          persist-credentials: false

      - name: Prepare E2E dependencies
        id: prepare
        uses: ./ci-e2e/.github/actions/prepare-e2e

      - name: Run Accounts E2E
        id: test-run
        continue-on-error: true
        timeout-minutes: 30
        run: METEOR_ALLOW_SUPERUSER=1 npm run test:e2e:group -- accounts

      - name: Retry failed tests
        if: steps.test-run.outcome == 'failure'
        timeout-minutes: 30
        run: |
          echo "::warning::First attempt failed, retrying..."
          METEOR_ALLOW_SUPERUSER=1 npm run test:e2e:group -- accounts

      # Save only successful runs, while the checkout and browser cache still exist.
      - name: Save E2E dependencies
        if: success() && steps.prepare.outputs.save-key != ''
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.prepare.outputs.save-key }}
          path: ${{ steps.prepare.outputs.cache-paths }}

      - name: Remove E2E checkout
        if: always()
        working-directory: .
        run: rm -rf -- ci-e2e
