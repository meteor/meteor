name: E2E Accounts

on:
  pull_request:
    paths:
      - 'packages/accounts-*/**'
      - 'tools/e2e-tests/accounts.test.js'
      - 'tools/e2e-tests/apps/accounts/**'
      - 'tools/e2e-tests/helpers/accounts-helpers.js'
      - '.github/workflows/e2e-accounts.yml'
  push:
    branches:
      - 'release-*'

concurrency:
  group: meteor-e2e-accounts-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOL_NODE_FLAGS: "--max_old_space_size=12288"
  # Force "localhost" to resolve to 127.0.0.1; runner prefers ::1, which
  # breaks local proxies to IPv4-only dev servers (ECONNREFUSED).
  NODE_OPTIONS: "--max_old_space_size=16384 --dns-result-order=ipv4first"
  # Per-test Jest retry count. Consumed by tools/e2e-tests/jest.setup.js.
  METEOR_E2E_TEST_RETRIES: 1

permissions:
  contents: read

jobs:
  test:
    name: Accounts
    runs-on: oss-vm
    timeout-minutes: 60
    container:
      image: node:22-bookworm
      # --init runs tini as PID 1 so orphaned processes get reaped. Without it
      # the container's PID 1 is `tail -f /dev/null`, which never calls wait(),
      # leaving every orphan (chrome, mongod, sh, ...) as a permanent zombie.
      options: --init --cpus 6 --memory 16g --security-opt seccomp=unconfined

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /root/.npm
            /root/.cache/ms-playwright
            dev_bundle
            .babel-cache
            .meteor
            node_modules
            tools/e2e-tests/node_modules
          key: e2e-${{ runner.os }}-${{ hashFiles('package-lock.json', 'meteor', 'tools/e2e-tests/package-lock.json') }}
          restore-keys: |
            e2e-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium chromium-headless-shell

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install deps
        run: npm install

      - name: Install test deps
        run: npm run install:e2e

      - name: Set NPM_LINK_RSPACK=false for release branches
        run: |
          echo "Current branch: ${{ github.head_ref || github.ref_name }}"
          if [[ "${{ github.head_ref || github.ref_name }}" == release-* ]]; then
            echo "NPM_LINK_RSPACK=false" >> $GITHUB_ENV
            echo "::warning::NPM_LINK_RSPACK=false on release branch. E2E tests will install @meteorjs/rspack from npm; make sure the latest version is published or tests may fail."
          fi

      - name: Prepare Meteor
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./meteor --get-ready --allow-superuser

      - name: Run Accounts E2E
        id: test-run
        continue-on-error: true
        timeout-minutes: 30
        run: METEOR_ALLOW_SUPERUSER=1 npm run test:e2e -- --testPathPattern=accounts.test.js

      - name: Retry failed tests
        if: steps.test-run.outcome == 'failure'
        timeout-minutes: 30
        run: |
          echo "::warning::First attempt failed, retrying..."
          METEOR_ALLOW_SUPERUSER=1 npm run test:e2e -- --testPathPattern=accounts.test.js
