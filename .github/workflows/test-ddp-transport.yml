name: Test DDP Transports

on:
  push:
    branches: [codex/mongodb8-bundle-validation]
  pull_request:

env:
  USE_TEST_DEV_BUNDLE_SERVER: "1"

jobs:
  test-ddp-transport:
    strategy:
      fail-fast: false
      matrix:
        transport:
          - 'sockjs'
          - 'uws'
    runs-on: oss-vm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.transport }}
      cancel-in-progress: true
    timeout-minutes: 30
    env:
      CXX: g++-12
      phantom: false
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI
      DDP_TRANSPORT: ${{ matrix.transport }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-node-26-${{ hashFiles('meteor', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-26-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 libnss3

      - name: Install npm dependencies
        run: npm install

      - name: Verify MongoDB 8 test bundle
        run: bash scripts/ci/verify-mongodb8-bundle.sh

      - name: Run DDP server tests (${{ matrix.transport }})
        run: ./packages/test-in-console/run.sh "ddp-server"

      # ddp-client holds the DDP version negotiation tests, which exercise the
      # server's send-then-close path. Running them per transport is what keeps
      # a transport from silently breaking negotiation.
      - name: Run DDP client tests (${{ matrix.transport }})
        run: ./packages/test-in-console/run.sh "ddp-client"
