name: Test DDP Transports

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-ddp-transport:
    strategy:
      fail-fast: false
      matrix:
        transport:
          - 'sockjs'
          - 'uws'
    runs-on: >-
      ${{ github.repository == 'meteor/meteor'
          && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-latest'
          || fromJSON(format('["self-hosted","linux",{0}]', toJSON(
               github.event.pull_request.head.repo.full_name != github.repository
               && (vars.METEOR_CI_FORK_LINUX_RUNNER || 'meteor-fork-ci')
               || vars.METEOR_CI_LINUX_RUNNER || 'oss-vm'))) }}
    defaults:
      run:
        working-directory: .ci-ddp
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.transport }}
      cancel-in-progress: true
    timeout-minutes: 30
    env:
      CXX: g++-12
      phantom: false
      TEST_PACKAGES_EXCLUDE: stylus
      METEOR_MODERN: true
      NODE_ENV: CI
      DDP_TRANSPORT: ${{ matrix.transport }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Other jobs may leave files in the shared root that checkout cannot remove.
          path: .ci-ddp
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Use job-local npm and test directories
        run: |
          mkdir -p "$RUNNER_TEMP/meteor-tests"
          echo "npm_config_cache=$RUNNER_TEMP/meteor-npm" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/meteor-tests" >> "$GITHUB_ENV"

      - name: Restore caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: &cache-paths |
            ${{ runner.temp }}/meteor-npm/_cacache
            .ci-ddp/.meteor
            .ci-ddp/.babel-cache
            .ci-ddp/dev_bundle
          key: ${{ runner.os }}-node-26-${{ hashFiles('.ci-ddp/meteor', '.ci-ddp/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-26-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 libnss3 unzip

      - name: Install npm dependencies
        run: npm install

      - name: Check package test runner
        run: node --test scripts/ci/__tests__/test-in-console.node-test.js

      - name: Run DDP server tests (${{ matrix.transport }})
        run: bash scripts/ci/run-ddp-transport-tests.sh "ddp-server"

      # ddp-client holds the DDP version negotiation tests, which exercise the
      # server's send-then-close path. Running them per transport is what keeps
      # a transport from silently breaking negotiation.
      - name: Run DDP client tests (${{ matrix.transport }})
        run: bash scripts/ci/run-ddp-transport-tests.sh "ddp-client"

      - name: Save caches
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Remove transport checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- .ci-ddp
