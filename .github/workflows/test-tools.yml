name: Test Tools

on:
  pull_request:
    paths:
      - "tools/**"
      - "packages/**"
      - "meteor"
      - "meteor.bat"
      - ".github/workflows/test-tools.yml"
      - "scripts/ci/build-test-matrix.js"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Multiplies the waitSecs for self-tests.
  TIMEOUT_SCALE_FACTOR: 8
  # Retry failed tests additional times.
  METEOR_SELF_TEST_RETRIES: 2
  METEOR_HEADLESS: true
  METEOR_PRETTY_OUTPUT: 0
  # Avoid SIGSEGV from cleaning up temp directories.
  METEOR_SAVE_TMPDIRS: 1
  # Suppress the self-test node-flags reminder.
  SELF_TEST_TOOL_NODE_FLAGS: " "
  METEOR_MODERN: true
  CXX: g++-12
  METEOR_ALLOW_SUPERUSER: 1
  # Pin the prepared-app-cache to a path that survives across the matrix
  # via actions/cache. The module's own (source-fingerprint, template) key
  # invalidates entries when tools/ or packages/ change, so the GHA cache
  # is safe to share across runs.
  METEOR_SELFTEST_PREPARED_APP_CACHE_DIR: /tmp/meteor-selftest-prepared-app-cache

jobs:
  # ─── Setup ────────────────────────────────────────────────────────────────
  # Runs --get-ready, warms the prepared-app cache for the modern template,
  # discovers all self-tests via --list-json, and emits the dynamic matrix
  # for the test job.
  setup:
    name: Setup
    runs-on: oss-vm
    container:
      image: meteor/circleci:2025.07.8-android-35-node-22
      options: --user root
    timeout-minutes: 75
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose globally-installed puppeteer to Node.js
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      # Narrowed cache key: the previous '**/package-lock.json' glob matched
      # 30+ files (including dev_bundle.xxx/ and packages/**/.npm/ dirs that
      # meteor itself writes during builds), thrashing the cache. Hash only
      # the files that actually pin the dev bundle and tool deps.
      - name: Restore caches
        id: meteor-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-meteor-tools-${{ hashFiles('meteor', 'package-lock.json', 'tools/package-lock.json', 'tools/package.json') }}
          restore-keys: |
            ${{ runner.os }}-meteor-tools-
            ${{ runner.os }}-meteor-

      - name: Restore prepared-app cache
        id: prepared-app-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.METEOR_SELFTEST_PREPARED_APP_CACHE_DIR }}
          key: ${{ runner.os }}-prepared-app-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prepared-app-

      - name: Prepare Meteor
        timeout-minutes: 65
        run: ./meteor --get-ready

      - name: Warm prepared-app cache (modern template)
        timeout-minutes: 10
        run: |
          mkdir -p "$METEOR_SELFTEST_PREPARED_APP_CACHE_DIR"
          # Runs the cache module's own self-test, which calls createApp('modern')
          # and pins the snapshot. Other templates lazy-warm during the matrix.
          ./meteor self-test '^prepared-app-cache roundtrip$' \
            --headless \
            --retries 0

      - name: Save prepared-app cache
        # Skip when this SHA already has an exact-match entry (workflow re-run
        # without new commits). actions/cache/save errors on duplicate keys.
        if: steps.prepared-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.METEOR_SELFTEST_PREPARED_APP_CACHE_DIR }}
          key: ${{ runner.os }}-prepared-app-${{ github.sha }}

      - name: Discover tests and build matrix
        id: discover
        run: |
          ./meteor self-test --list-json-out /tmp/tests.json --headless
          MATRIX=$(node scripts/ci/build-test-matrix.js /tmp/tests.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ─── Per-test matrix ──────────────────────────────────────────────────────
  # One job per self-test. Heavy tests (modern/compiler-plugins/cordova) get
  # elevated container resources via the matrix `resources` field.
  test:
    name: "${{ matrix.file }}: ${{ matrix.name }}"
    runs-on: oss-vm
    needs: setup
    timeout-minutes: 45
    container:
      image: meteor/circleci:2025.07.8-android-35-node-22
      options: ${{ matrix.resources == 'heavy' && '--user root --cpus 4 --memory 16g --security-opt seccomp=unconfined' || '--user root' }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      # Heavy tests need extra wait for slow operations (Cordova builds, etc.)
      TIMEOUT_SCALE_FACTOR: ${{ matrix.resources == 'heavy' && '14' || '8' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose globally-installed puppeteer to Node.js
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Add Gradle to PATH
        # Cordova tests need gradle. Cheap to add unconditionally — sdkman
        # path is the same regardless of whether the test consumes it.
        run: echo "/home/circleci/.sdkman/candidates/gradle/8.7/bin" >> "$GITHUB_PATH"

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-meteor-tools-${{ hashFiles('meteor', 'package-lock.json', 'tools/package-lock.json', 'tools/package.json') }}
          restore-keys: |
            ${{ runner.os }}-meteor-tools-
            ${{ runner.os }}-meteor-

      - name: Restore prepared-app cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.METEOR_SELFTEST_PREPARED_APP_CACHE_DIR }}
          key: ${{ runner.os }}-prepared-app-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prepared-app-

      - name: Log environment
        env:
          TEST_NAME: ${{ matrix.name }}
          TEST_FILE: ${{ matrix.file }}
          TEST_RESOURCES: ${{ matrix.resources }}
        run: |
          echo "Test: $TEST_NAME"
          echo "File: $TEST_FILE.js"
          echo "Resources: $TEST_RESOURCES"
          echo "Node: $(node --version)"
          echo "Meteor Node: $(./meteor node --version)"

      - name: Run self-test
        env:
          # Pass via env so test names with shell metacharacters ($, `, etc.)
          # reach meteor verbatim instead of being expanded by bash.
          TEST_REGEX: ${{ matrix.regex }}
          TEST_JUNIT: ${{ matrix.junit }}
        run: |
          mkdir -p tmp/results/junit
          ulimit -c unlimited
          ./meteor self-test \
            "$TEST_REGEX" \
            --retries "$METEOR_SELF_TEST_RETRIES" \
            --headless \
            --junit "./tmp/results/junit/$TEST_JUNIT"

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.id }}
          path: ./tmp/results
          if-no-files-found: ignore

  # ─── JUnit aggregation ────────────────────────────────────────────────────
  # Always runs (success or failure of the matrix) so a single merged JUnit
  # report is available for downstream consumers and PR check summaries.
  aggregate-junit:
    name: Aggregate JUnit
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Download all junit artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: junit-*
          path: ./junit-artifacts
          merge-multiple: true

      - name: Upload merged junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-all
          path: ./junit-artifacts
          if-no-files-found: ignore
