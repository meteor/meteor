name: Test Tools

on:
  pull_request:
    paths:
      - "tools/**"
      - "packages/**"
      - "meteor"
      - "meteor.bat"
      - ".github/workflows/test-tools.yml"
      - "scripts/ci/build-test-matrix.js"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Multiplies the waitSecs for self-tests.
  TIMEOUT_SCALE_FACTOR: 8
  # Retry failed tests additional times.
  METEOR_SELF_TEST_RETRIES: 2
  METEOR_HEADLESS: true
  METEOR_PRETTY_OUTPUT: 0
  # Avoid SIGSEGV from cleaning up temp directories.
  METEOR_SAVE_TMPDIRS: 1
  # Suppress the self-test node-flags reminder.
  SELF_TEST_TOOL_NODE_FLAGS: " "
  METEOR_MODERN: true
  # Pin the prepared-app-cache to a path that survives across the matrix
  # via actions/cache. The module's own (source-fingerprint, template) key
  # invalidates entries when tools/ or packages/ change, so the GHA cache
  # is safe to share across runs.
  METEOR_SELFTEST_PREPARED_APP_CACHE_DIR: /tmp/meteor-selftest-prepared-app-cache
  # Pin puppeteer to a specific major version so the GHA cache key for
  # ~/.npm-global + ~/.cache/puppeteer is stable. Bumping this string
  # invalidates the cache and pulls a fresh chromium on the next setup run.
  PUPPETEER_VERSION: "24"

jobs:
  # ─── Setup ────────────────────────────────────────────────────────────────
  # Runs --get-ready, warms the prepared-app cache for the modern template,
  # discovers all self-tests via --list-json, and emits the dynamic matrix
  # for the test job.
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Install once in setup, save the result, then matrix jobs restore.
      # Caches both the global npm dir (the `puppeteer` package) and
      # ~/.cache/puppeteer (the chromium binary puppeteer downloads at
      # postinstall — this is the bulk of the cost, ~30-60s per job).
      # User-owned ~/.npm-global avoids sudo and gives a predictable path
      # for the cache action; would be /usr/local/lib/node_modules with
      # the default prefix.
      - name: Restore puppeteer install cache
        id: puppeteer-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm-global
            ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ env.PUPPETEER_VERSION }}

      - name: Install puppeteer (cache miss only)
        if: steps.puppeteer-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          npm install -g "puppeteer@$PUPPETEER_VERSION"

      - name: Expose puppeteer to Node.js
        run: |
          echo "NODE_PATH=$HOME/.npm-global/lib/node_modules" >> "$GITHUB_ENV"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # Split into two caches because the two buckets evolve on completely
      # different timescales: the dev_bundle key files churn ~31x/90d (mostly
      # BUNDLE_VERSION bumps) while packages/**/npm-shrinkwrap.json changes
      # ~1x/90d, and the two sets never change in the same commit. With a
      # single combined key, every dev_bundle bump unnecessarily evicted the
      # 409M packages/.npm bucket and forced cold per-package npm reinstalls.
      - name: Restore dev_bundle cache
        id: dev-bundle-cache
        uses: actions/cache@v5
        with:
          path: |
            .meteor
            dev_bundle
          key: ${{ runner.os }}-meteor-tools-${{ hashFiles('meteor', 'package-lock.json', 'tools/package-lock.json', 'tools/package.json') }}
          restore-keys: |
            ${{ runner.os }}-meteor-tools-
            ${{ runner.os }}-meteor-

      # Per-package node_modules. Restoring these lets `meteor --get-ready`
      # short-circuit the per-package "updating npm dependencies" loop via
      # the shrinkwrap-subtree check in meteor-npm.js (line ~682). Cold
      # runs without this take ~4-5min just spawning serial `npm install`
      # children. Stale caches are safe — the runtime subtree check
      # detects mismatches and reinstalls per-package on demand.
      - name: Restore per-package npm cache
        id: pkg-npm-cache
        uses: actions/cache@v5
        with:
          path: packages/**/.npm
          key: ${{ runner.os }}-pkg-npm-${{ hashFiles('packages/**/npm-shrinkwrap.json') }}
          restore-keys: |
            ${{ runner.os }}-pkg-npm-

      - name: Restore prepared-app cache
        id: prepared-app-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.METEOR_SELFTEST_PREPARED_APP_CACHE_DIR }}
          key: ${{ runner.os }}-prepared-app-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prepared-app-

      - name: Prepare Meteor
        timeout-minutes: 65
        run: ./meteor --get-ready

      # One-shot diagnostic: prints what's eating the cache so we can
      # decide whether to prune dev_bundle subdirs, packages/*/.npm, or
      # split the cache further. Cheap (a few seconds of `du`) and only
      # runs in the setup job, not the matrix.
      - name: Inspect cache contents
        run: |
          set +e
          echo "=== Top-level cache paths ==="
          du -shc .meteor dev_bundle 2>/dev/null
          echo ""
          echo "=== dev_bundle subdirs (top 15 by size) ==="
          du -sh dev_bundle/* 2>/dev/null | sort -hr | head -15
          echo ""
          echo "=== packages/*/.npm total ==="
          du -shc packages/*/.npm 2>/dev/null | tail -1
          echo ""
          echo "=== Top 20 packages/*/.npm by size ==="
          du -sh packages/*/.npm 2>/dev/null | sort -hr | head -20

      - name: Warm prepared-app cache (modern template)
        timeout-minutes: 10
        run: |
          mkdir -p "$METEOR_SELFTEST_PREPARED_APP_CACHE_DIR"
          # Runs the cache module's own self-test, which calls createApp('modern')
          # and pins the snapshot. Other templates lazy-warm during the matrix.
          ./meteor self-test '^prepared-app-cache roundtrip$' \
            --headless \
            --retries 0

      - name: Save prepared-app cache
        # Skip when this SHA already has an exact-match entry (workflow re-run
        # without new commits). actions/cache/save errors on duplicate keys.
        if: steps.prepared-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.METEOR_SELFTEST_PREPARED_APP_CACHE_DIR }}
          key: ${{ runner.os }}-prepared-app-${{ github.sha }}

      - name: Discover tests and build matrix
        id: discover
        run: |
          ./meteor self-test --list-json-out /tmp/tests.json --headless
          node scripts/ci/build-test-matrix.js /tmp/tests.json > /tmp/matrix.json
          # Heredoc form, not `name=value`. Single-line $GITHUB_OUTPUT
          # interprets backslashes inside the value (regexes contain `\(`,
          # `\)`, etc.), which makes fromJson() reject the matrix.
          {
            echo 'matrix<<MATRIX_EOF'
            cat /tmp/matrix.json
            echo 'MATRIX_EOF'
          } >> "$GITHUB_OUTPUT"

  # ─── Per-file matrix ──────────────────────────────────────────────────────
  # One job per test file. All tests in a file run in a single meteor process
  # so they share the prepared-app-cache copy + per-process build state, which
  # matters for files that exercise the same template repeatedly. ubuntu-latest
  # gives every job 4 vCPU / 16 GB which already matches the previous `heavy`
  # tier — TIMEOUT_SCALE_FACTOR is the only knob that still differentiates.
  test:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Effectively unlimited for our matrix size (~55 entries). Hosted
      # runners have no pool capacity; cap exists only as a safety rail
      # against runaway matrices from a future build-test-matrix.js bug.
      max-parallel: 256
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      # Heavy files need extra wait for slow operations (Cordova builds, etc.)
      TIMEOUT_SCALE_FACTOR: ${{ matrix.resources == 'heavy' && '14' || '8' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Restore from the cache populated by the setup job. Fallback install
      # below is defensive — if setup ever fails to save (e.g. cache eviction
      # mid-workflow), the matrix job still works at the cost of one slow run.
      - name: Restore puppeteer install cache
        id: puppeteer-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.npm-global
            ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ env.PUPPETEER_VERSION }}

      - name: Install puppeteer (cache miss only)
        if: steps.puppeteer-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          npm install -g "puppeteer@$PUPPETEER_VERSION"

      - name: Expose puppeteer to Node.js
        run: |
          echo "NODE_PATH=$HOME/.npm-global/lib/node_modules" >> "$GITHUB_ENV"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # Mirrors the two-bucket cache layout from the setup job. See the
      # comment there for why these are split.
      - name: Restore dev_bundle cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .meteor
            dev_bundle
          key: ${{ runner.os }}-meteor-tools-${{ hashFiles('meteor', 'package-lock.json', 'tools/package-lock.json', 'tools/package.json') }}
          restore-keys: |
            ${{ runner.os }}-meteor-tools-
            ${{ runner.os }}-meteor-

      - name: Restore per-package npm cache
        uses: actions/cache/restore@v5
        with:
          path: packages/**/.npm
          key: ${{ runner.os }}-pkg-npm-${{ hashFiles('packages/**/npm-shrinkwrap.json') }}
          restore-keys: |
            ${{ runner.os }}-pkg-npm-

      - name: Restore prepared-app cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.METEOR_SELFTEST_PREPARED_APP_CACHE_DIR }}
          key: ${{ runner.os }}-prepared-app-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prepared-app-

      - name: Log environment
        env:
          TEST_FILE: ${{ matrix.file }}
          TEST_COUNT: ${{ matrix.count }}
          TEST_RESOURCES: ${{ matrix.resources }}
        run: |
          echo "File: $TEST_FILE.js ($TEST_COUNT tests)"
          echo "Resources: $TEST_RESOURCES"
          echo "Meteor Node: $(dev_bundle/bin/node --version)"

      - name: Run self-test
        env:
          # Pass via env to avoid shell interpolation surprises for filenames
          # like cordova-append-config that contain hyphens etc.
          TEST_FILE_REGEX: ${{ matrix.fileRegex }}
          TEST_JUNIT: ${{ matrix.junit }}
        run: |
          mkdir -p tmp/results/junit
          ulimit -c unlimited
          ./meteor self-test \
            --file "$TEST_FILE_REGEX" \
            --retries "$METEOR_SELF_TEST_RETRIES" \
            --headless \
            --junit "./tmp/results/junit/$TEST_JUNIT"

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.id }}
          path: ./tmp/results
          if-no-files-found: ignore

  # ─── JUnit aggregation ────────────────────────────────────────────────────
  # Always runs (success or failure of the matrix) so a single merged JUnit
  # report is available for downstream consumers and PR check summaries.
  aggregate-junit:
    name: Aggregate JUnit
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Download all junit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: ./junit-artifacts
          merge-multiple: true

      - name: Upload merged junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-all
          path: ./junit-artifacts
          if-no-files-found: ignore
