name: Test Tools

on:
  pull_request:
    paths:
      - "tools/**"
      - "packages/**"
      - "meteor"
      - "meteor.bat"
      - ".github/workflows/test-tools.yml"
      - "scripts/ci/build-test-matrix.js"
      - "scripts/ci/build-test-matrix.test.js"
      - "scripts/ci/test-tools-cache-keys.test.js"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Multiplies the waitSecs for self-tests.
  TIMEOUT_SCALE_FACTOR: 8
  # Retry failed tests additional times.
  METEOR_SELF_TEST_RETRIES: 2
  METEOR_HEADLESS: true
  METEOR_PRETTY_OUTPUT: 0
  # Avoid SIGSEGV from cleaning up temp directories.
  METEOR_SAVE_TMPDIRS: 1
  # Skip this test on every run (it lives in Isolated Tests instead).
  SELF_TEST_EXCLUDE: "add debugOnly and prodOnly packages"
  # Suppress the self-test node-flags reminder.
  SELF_TEST_TOOL_NODE_FLAGS: " "
  METEOR_MODERN: true
  CXX: g++-12
  METEOR_ALLOW_SUPERUSER: 1


jobs:
  # ─── Setup ────────────────────────────────────────────────────────────────────
  # Prepares the Meteor environment, populates the cache, and discovers the
  # source-file matrix used by the parallel test jobs.
  setup:
    name: Setup
    runs-on: oss-vm
    container:
      image: meteor/circleci:2025.07.8-android-35-node-22
      # --init runs tini as PID 1 so orphaned processes get reaped (otherwise
      # PID 1 is `tail -f /dev/null`, which never calls wait() and leaves
      # zombies behind).
      options: --init --user root
    timeout-minutes: 75
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose globally-installed puppeteer to Node.js
        # puppeteer is pre-installed on oss-vm via `npm install -g`.
        # Setting NODE_PATH lets `require('puppeteer')` resolve it directly,
        # so --get-ready skips the slow `./meteor npm install -g puppeteer` step.
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Restore dev bundle cache
        id: dev-bundle-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-node-24-meteor-tools-${{ hashFiles('meteor', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-meteor-tools-
            ${{ runner.os }}-node-24-meteor-

      - name: Restore package npm cache
        id: package-npm-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/**/.npm
          key: ${{ runner.os }}-node-24-pkg-npm-${{ hashFiles('packages/**/package.js', 'packages/**/npm-shrinkwrap.json') }}

      - name: Validate Test Tools cache keys
        run: node --test scripts/ci/test-tools-cache-keys.test.js

      - name: Prepare Meteor
        # Run on every workflow so the package catalog at .meteor/package-metadata
        # is refreshed and includes any release referenced by versionsFrom.
        timeout-minutes: 65
        run: ./meteor --get-ready

      - name: Validate test matrix generator
        run: node --test scripts/ci/build-test-matrix.test.js

      - name: Discover tests and build matrix
        id: discover
        run: |
          ./meteor self-test \
            --force-online \
            --list-json-out /tmp/tests.json \
            --exclude "$SELF_TEST_EXCLUDE" \
            --without-tag "custom-warehouse" \
            --headless
          node scripts/ci/build-test-matrix.js /tmp/tests.json > /tmp/matrix.json
          {
            echo 'matrix<<MATRIX_EOF'
            cat /tmp/matrix.json
            echo 'MATRIX_EOF'
          } >> "$GITHUB_OUTPUT"

  # ─── Isolated Tests ───────────────────────────────────────────────────────────
  # Tests that must run in isolation: the debugOnly/prodOnly package test
  # (excluded from the matrix) and any custom-warehouse tests.
  isolated-tests:
    name: Isolated Tests
    runs-on: oss-vm
    container:
      image: meteor/circleci:2025.07.8-android-35-node-22
      # --init runs tini as PID 1 so orphaned processes get reaped (otherwise
      # PID 1 is `tail -f /dev/null`, which never calls wait() and leaves
      # zombies behind).
      options: --init --user root
    needs: setup
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose globally-installed puppeteer to Node.js
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Restore dev bundle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-node-24-meteor-tools-${{ hashFiles('meteor', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-meteor-tools-
            ${{ runner.os }}-node-24-meteor-

      - name: Restore package npm cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/**/.npm
          key: ${{ runner.os }}-node-24-pkg-npm-${{ hashFiles('packages/**/package.js', 'packages/**/npm-shrinkwrap.json') }}

      - name: Log environment
        run: |
          lsb_release -a
          uname -srm
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Meteor Node: $(./meteor node --version)"
          echo "Meteor NPM: $(./meteor npm --version)"

      - name: Running self-test (add debugOnly and prodOnly packages)
        timeout-minutes: 20
        run: |
          ulimit -c unlimited
          ./meteor self-test \
            'add debugOnly and prodOnly packages' \
            --retries "$METEOR_SELF_TEST_RETRIES" \
            --headless

      - name: Running self-test (Custom Warehouse Tests)
        timeout-minutes: 20
        run: |
          ulimit -c unlimited
          ./meteor self-test \
            --retries "$METEOR_SELF_TEST_RETRIES" \
            --exclude "$SELF_TEST_EXCLUDE" \
            --headless \
            --with-tag "custom-warehouse"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-isolated-tests
          path: ./tmp/results
          if-no-files-found: ignore

  # ─── Per-file matrix ──────────────────────────────────────────────────────────
  # All tests from one source file run in the same process. This retains their
  # shared setup while allowing files to run independently across workers.
  test:
    name: ${{ matrix.name }}
    runs-on: oss-vm
    container:
      image: meteor/circleci:2025.07.8-android-35-node-22
      options: ${{ matrix.resources == 'heavy' && '--init --user root --cpus 4 --memory 16g --security-opt seccomp=unconfined' || '--init --user root' }}
    needs: setup
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      TIMEOUT_SCALE_FACTOR: ${{ matrix.resources == 'heavy' && '14' || '8' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose globally-installed puppeteer to Node.js
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Add Gradle to PATH
        # Gradle is pre-installed in the container and required by Cordova tests.
        run: echo "/home/circleci/.sdkman/candidates/gradle/8.7/bin" >> "$GITHUB_PATH"

      - name: Restore dev bundle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            .meteor
            .babel-cache
            dev_bundle
          key: ${{ runner.os }}-node-24-meteor-tools-${{ hashFiles('meteor', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-meteor-tools-
            ${{ runner.os }}-node-24-meteor-

      - name: Restore package npm cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/**/.npm
          key: ${{ runner.os }}-node-24-pkg-npm-${{ hashFiles('packages/**/package.js', 'packages/**/npm-shrinkwrap.json') }}

      - name: Log environment
        env:
          TEST_FILE: ${{ matrix.file }}
          TEST_COUNT: ${{ matrix.count }}
          TEST_RESOURCES: ${{ matrix.resources }}
        run: |
          lsb_release -a
          uname -srm
          echo "File: $TEST_FILE.js ($TEST_COUNT tests)"
          echo "Resources: $TEST_RESOURCES"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Meteor Node: $(./meteor node --version)"
          echo "Meteor NPM: $(./meteor npm --version)"
          java --version
          gradle --version

      - name: Running self-test
        timeout-minutes: 55
        env:
          TEST_FILE_REGEX: ${{ matrix.fileRegex }}
          TEST_JUNIT: ${{ matrix.junit }}
        run: |
          mkdir -p tmp/results/junit
          ulimit -c unlimited
          ./meteor self-test \
            --file "$TEST_FILE_REGEX" \
            --retries "$METEOR_SELF_TEST_RETRIES" \
            --exclude "$SELF_TEST_EXCLUDE" \
            --headless \
            --junit "./tmp/results/junit/$TEST_JUNIT" \
            --without-tag "custom-warehouse"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.id }}
          path: ./tmp/results
          if-no-files-found: ignore
