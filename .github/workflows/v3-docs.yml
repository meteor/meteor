name: V3 Docs

on:
  push:
    paths:
      - 'v3-docs/docs/**'
      - '.github/workflows/v3-docs.yml'
  pull_request:
    paths:
      - 'v3-docs/docs/**'
      - '.github/workflows/v3-docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/run-linux-check-in-docker.yml
    with:
      image: node:24-bookworm
      directory: v3-docs/docs
      npm-lockfile: v3-docs/docs/package-lock.json
      command: |
        npm ci
        npm run test:links
