name: NPM eslint-plugin-meteor
on:
  push:
    paths:
      - "npm-packages/eslint-plugin-meteor/**"
  pull_request:
    paths:
      - "npm-packages/eslint-plugin-meteor/**"

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  test:
    uses: ./.github/workflows/linux-check.yml
    with:
      image: node:26-bookworm
      directory: npm-packages/eslint-plugin-meteor
      npm-lockfile: npm-packages/eslint-plugin-meteor/package-lock.json
      command: |
        npm ci
        npm test
