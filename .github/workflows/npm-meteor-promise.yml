name: NPM meteor-promise
on:
  push:
    paths:
      - "npm-packages/meteor-promise/**"
  pull_request:
    paths:
      - "npm-packages/meteor-promise/**"

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  test:
    uses: ./.github/workflows/linux-check.yml
    with:
      image: node:14-bullseye
      directory: npm-packages/meteor-promise
      npm-lockfile: npm-packages/meteor-promise/package-lock.json
      command: |
        npm ci
        npm run test
