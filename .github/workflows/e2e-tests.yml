name: E2E Tests

on:
  push:
    branches: [ci/release-3.6.2]
    paths:
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: meteor-e2e-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOL_NODE_FLAGS: "--max_old_space_size=12288"
  # Generated apps run Playwright in child processes whose HOME can differ
  # from the Actions shell. Keep all browser installs in one explicit path.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  # Force "localhost" to resolve to 127.0.0.1; runner prefers ::1, which
  # breaks local proxies to IPv4-only dev servers (ECONNREFUSED).
  NODE_OPTIONS: "--max_old_space_size=16384 --dns-result-order=ipv4first"
  # npm submits an audit request with every install. Meteor runs many installs
  # when caches are cold, and this workflow does not consume their automatic
  # audit reports. Avoid making E2E reliability depend on npm's audit endpoint.
  npm_config_audit: "false"
  # Per-test Jest retry count. Consumed by tools/e2e-tests/jest.setup.js.
  METEOR_E2E_TEST_RETRIES: 1

jobs:
  groups:
    name: E2E group audit
    runs-on: oss-vm
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 36a5f74cdd216e936d1f2a306fc534a9c3dbe9b0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/e2e-tests/package-lock.json
      - name: Install discovery dependencies
        run: npm ci --prefix tools/e2e-tests
      - name: Audit all E2E groups
        run: npm run test:e2e:groups:audit
      - name: Generate group matrix
        id: groups
        run: echo "matrix=$(node tools/e2e-tests/scripts/list-test-groups.js --json)" >> "$GITHUB_OUTPUT"

  test:
    needs: groups
    name: ${{ matrix.category }}
    runs-on: oss-vm
    # Budget both longer Regressions attempts and environment preparation.
    timeout-minutes: ${{ matrix.group == 'regressions' && 110 || 60 }}
    env:
      # SWC's native addon cache rejects parents owned by another user.
      # Actions mounts the host-owned /github/home into this root container.
      # Keep materialized addons in a private namespace on its own filesystem.
      SWC_NATIVE_BINDING_CACHE: /tmp/meteor-swc-native
    container:
      image: node:22-bookworm
      # --init runs tini as PID 1 so orphaned processes get reaped. Without it
      # the container's PID 1 is `tail -f /dev/null`, which never calls wait(),
      # leaving every orphan (chrome, mongod, sh, ...) as a permanent zombie.
      options: >-
        --init
        --cpus 6
        --memory 16g
        --security-opt seccomp=unconfined
        -v /var/run/docker.sock:/var/run/docker.sock

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.groups.outputs.matrix) }}

    steps:
      - name: Install Docker CLI
        run: |
          # Install a current docker CLI from Docker's official repo. Debian
          # bookworm's `docker.io` is 20.10 (API 1.41), which the self-hosted
          # host daemon (Docker 29+, minimum API 1.44) rejects with
          # "client version 1.41 is too old. Minimum supported API version is 1.44".
          apt-get update
          # Port cleanup needs ss, lsof and fuser to find orphaned listeners.
          apt-get install -y ca-certificates curl iproute2 lsof psmisc procps
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce-cli
          docker version
          docker ps
          docker system df

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: 36a5f74cdd216e936d1f2a306fc534a9c3dbe9b0
          submodules: recursive

      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            /root/.npm
            ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
            dev_bundle
            .babel-cache
            .meteor
            node_modules
            tools/e2e-tests/node_modules
          key: e2e-${{ runner.os }}-${{ hashFiles('package-lock.json', 'meteor', 'tools/e2e-tests/package-lock.json') }}
          restore-keys: |
            e2e-${{ runner.os }}-

      - name: Install deps
        run: npm install

      - name: Install test deps
        # This installs the browsers and system dependencies using the exact
        # Playwright version declared by tools/e2e-tests/package.json.
        run: npm run install:e2e

      - name: Set NPM_LINK_RSPACK=false for release branches
        shell: bash
        env:
          BRANCH: release-3.6.2
        run: |
          echo "Current branch: $BRANCH"
          if [[ "$BRANCH" == release-* ]]; then
            echo "NPM_LINK_RSPACK=false" >> $GITHUB_ENV
            echo "::warning::NPM_LINK_RSPACK=false on release branch. E2E tests will install @meteorjs/rspack from npm — make sure the latest version is published or tests may fail."
          fi

      - name: Prepare Meteor
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./meteor --get-ready --allow-superuser

      - name: Run tests for ${{ matrix.category }}
        id: test-run
        continue-on-error: true
        timeout-minutes: ${{ matrix.group == 'regressions' && 40 || 20 }}
        run: METEOR_ALLOW_SUPERUSER=1 npm run test:e2e:group -- "${{ matrix.group }}"

      - name: Clean up before retry
        if: steps.test-run.outcome == 'failure'
        run: |
          # First attempt and retry share this container; a hard timeout can
          # orphan processes (EADDRINUSE) and temp dirs. The retry recreates
          # each app fresh, so only container leftovers need clearing.
          echo "Cleaning up after the failed attempt..."
          pkill -9 -f 'meteortest-' || true
          # Detached bundler/db children may not carry the temp path in argv.
          pkill -9 -f mongod || true
          pkill -9 -f rspack || true
          rm -rf /tmp/meteortest-* /tmp/meteor-build-* || true
          sleep 3
          echo "Cleanup done."

      - name: Retry failed tests for ${{ matrix.category }}
        if: steps.test-run.outcome == 'failure'
        timeout-minutes: ${{ matrix.group == 'regressions' && 45 || 25 }}
        run: |
          echo "::warning::First attempt failed, retrying..."
          METEOR_ALLOW_SUPERUSER=1 npm run test:e2e:group -- "${{ matrix.group }}"
