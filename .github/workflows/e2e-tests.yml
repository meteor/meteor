name: E2E Tests

on:
  workflow_dispatch:

concurrency:
  group: meteor-native-preparation-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOL_NODE_FLAGS: "--max_old_space_size=12288"
  # Force "localhost" to resolve to 127.0.0.1; runner prefers ::1, which
  # breaks local proxies to IPv4-only dev servers (ECONNREFUSED).
  NODE_OPTIONS: "--max_old_space_size=16384 --dns-result-order=ipv4first"
  # npm submits an audit request with every install. Meteor runs many installs
  # when caches are cold, and this workflow does not consume their automatic
  # audit reports. Avoid making E2E reliability depend on npm's audit endpoint.
  npm_config_audit: "false"
  # Per-test Jest retry count. Consumed by tools/e2e-tests/jest.setup.js.
  METEOR_E2E_TEST_RETRIES: 1

jobs:
  test:
    name: ${{ matrix.category }}
    runs-on: oss-vm
    timeout-minutes: 25
    container:
      image: node:22-bookworm
      # --init runs tini as PID 1 so orphaned processes get reaped. Without it
      # the container's PID 1 is `tail -f /dev/null`, which never calls wait(),
      # leaving every orphan (chrome, mongod, sh, ...) as a permanent zombie.
      options: >-
        --init
        --cpus 6
        --memory 16g
        --security-opt seccomp=unconfined
        --cap-add SYS_PTRACE
        -v /var/run/docker.sock:/var/run/docker.sock

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        category:
          - Native preparation 1
          - Native preparation 2

    steps:
      - name: Install Docker CLI
        run: |
          # Install a current docker CLI from Docker's official repo. Debian
          # bookworm's `docker.io` is 20.10 (API 1.41), which the self-hosted
          # host daemon (Docker 29+, minimum API 1.44) rejects with
          # "client version 1.41 is too old. Minimum supported API version is 1.44".
          apt-get update
          apt-get install -y ca-certificates curl gdb
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce-cli
          docker version
          docker ps
          docker system df

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /root/.npm
            /root/.cache/ms-playwright
            dev_bundle
            .babel-cache
            .meteor
            node_modules
            tools/e2e-tests/node_modules
          key: e2e-${{ runner.os }}-${{ hashFiles('package-lock.json', 'meteor', 'tools/e2e-tests/package-lock.json') }}
          restore-keys: |
            e2e-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium chromium-headless-shell

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install deps
        run: npm install

      - name: Install test deps
        run: npm run install:e2e

      - name: Prepare Meteor with native signal tracing
        shell: bash
        env:
          NPM_LINK_RSPACK: "false"
        run: |
          cc -shared -fPIC -g -O1 -Wall -Wextra -Werror -I /usr/local/include/node \
            scripts/ci/native-preparation-trace.c -o /tmp/native-preparation-trace.node
          cat /proc/sys/kernel/core_pattern
          ulimit -c unlimited
          export NODE_OPTIONS="$NODE_OPTIONS --require=/tmp/native-preparation-trace.node"
          set +e
          python3 scripts/ci/trace-native-preparation.py node -e 'process.kill(process.pid, "SIGABRT")'
          smoke_status=$?
          set -e
          test "$smoke_status" -eq 134
          grep -q trace_native_signal /tmp/meteor-preparation.log
          cp /tmp/meteor-preparation.log /tmp/native-trace-smoke.log
          python3 scripts/ci/trace-native-preparation.py ./meteor --get-ready --allow-superuser

      - name: Save native preparation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-preparation-${{ strategy.job-index }}
          path: |
            /tmp/meteor-preparation.log
            /tmp/native-trace-smoke.log
          if-no-files-found: warn
          retention-days: 7
