name: E2E Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && !contains(fromJSON('["ci:e2e","ci:e2e:apps","ci:e2e:skeletons","ci:e2e:examples"]'), github.event.label.name) && format('-ignored-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  E2E_OPT_IN_LABEL: "ci:e2e"
  E2E_ENABLE_PATH_RULES: "false"
  TOOL_NODE_FLAGS: "--max_old_space_size=12288"
  # Force "localhost" to resolve to 127.0.0.1; runner prefers ::1, which
  # breaks local proxies to IPv4-only dev servers (ECONNREFUSED).
  NODE_OPTIONS: "--max_old_space_size=16384 --dns-result-order=ipv4first"
  # Per-test Jest retry count. Consumed by tools/e2e-tests/jest.setup.js.
  METEOR_E2E_TEST_RETRIES: 1


jobs:
  e2e_gate:
    name: E2E Gate
    runs-on: ubuntu-latest
    outputs:
      real_count: ${{ steps.plan.outputs.real_count }}
      noop_count: ${{ steps.plan.outputs.noop_count }}
      emit_checks: ${{ steps.plan.outputs.emit_checks }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      reason: ${{ steps.plan.outputs.reason }}
      real_matrix: ${{ steps.plan.outputs.real_matrix }}
      noop_matrix: ${{ steps.plan.outputs.noop_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Collect pull request files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            return files.map(({ filename }) => filename);

      - name: Write resolver input
        env:
          CHANGED_FILES: ${{ steps.files.outputs.result }}
          E2E_ENABLE_PATH_RULES: ${{ env.E2E_ENABLE_PATH_RULES }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const input = {
            labels: ${{ toJSON(github.event.pull_request.labels.*.name) }},
            changedFiles: JSON.parse(process.env.CHANGED_FILES),
            isDraft: ${{ toJSON(github.event.pull_request.draft) }},
            enablePathRules: process.env.E2E_ENABLE_PATH_RULES === "true",
            action: ${{ toJSON(github.event.action) }},
            addedLabel: ${{ toJSON(github.event.label.name || null) }}
          };
          fs.writeFileSync("e2e-plan-input.json", JSON.stringify(input, null, 2));
          NODE

      - name: Resolve E2E plan
        id: plan
        run: node tools/e2e-tests/scripts/resolve-ci-plan.mjs e2e-plan-input.json

  test:
    name: ${{ matrix.check }}
    needs: e2e_gate
    if: needs.e2e_gate.outputs.real_count != '0'
    runs-on: oss-vm
    timeout-minutes: 60
    container:
      image: node:22-bookworm
      options: >-
        --cpus 6
        --memory 16g
        --security-opt seccomp=unconfined
        -v /var/run/docker.sock:/var/run/docker.sock

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.e2e_gate.outputs.real_matrix) }}

    steps:
      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io
          docker version
          docker ps
          docker system df

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            /root/.npm
            /root/.cache/ms-playwright
            dev_bundle
            .babel-cache
            .meteor
            node_modules
            tools/e2e-tests/node_modules
          key: e2e-${{ runner.os }}-${{ hashFiles('package-lock.json', 'meteor', 'tools/e2e-tests/package-lock.json') }}
          restore-keys: |
            e2e-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium chromium-headless-shell

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install deps
        run: npm install

      - name: Install test deps
        run: npm run install:e2e

      - name: Set NPM_LINK_RSPACK=false for release branches
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Current branch: $BRANCH_NAME"
          if [[ "$BRANCH_NAME" == release-* ]]; then
            echo "NPM_LINK_RSPACK=false" >> "$GITHUB_ENV"
            echo "::warning::NPM_LINK_RSPACK=false on release branch. E2E tests will install @meteorjs/rspack from npm. Make sure the latest version is published or tests may fail."
          fi

      - name: Prepare Meteor
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./meteor --get-ready --allow-superuser

      - name: Run tests for ${{ matrix.check }}
        id: test-run
        continue-on-error: true
        timeout-minutes: 15
        env:
          JEST_ARGS_JSON: ${{ matrix.jestArgsJson }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require("child_process");

          function splitArgs(input) {
            const tokens = [];
            let token = "";
            let quote = null;

            for (let index = 0; index < input.length; index += 1) {
              const char = input[index];

              if (char === "\\") {
                const next = input[index + 1];
                if (quote && (next === quote || next === "\\")) {
                  token += next;
                  index += 1;
                } else if (!quote && next && (/[\s"'\\]/).test(next)) {
                  token += next;
                  index += 1;
                } else {
                  token += char;
                }
                continue;
              }

              if (quote) {
                if (char === quote) {
                  quote = null;
                } else {
                  token += char;
                }
                continue;
              }

              if (char === "\"" || char === "'") {
                quote = char;
                continue;
              }

              if (/\s/.test(char)) {
                if (token) {
                  tokens.push(token);
                  token = "";
                }
                continue;
              }

              token += char;
            }

            if (quote) {
              throw new Error(`Unclosed ${quote} quote in Jest args: ${input}`);
            }

            if (token) {
              tokens.push(token);
            }

            return tokens;
          }

          const argsList = JSON.parse(process.env.JEST_ARGS_JSON);
          for (const args of argsList) {
            const result = spawnSync("npm", ["run", "test:e2e", "--", ...splitArgs(args)], {
              env: { ...process.env, METEOR_ALLOW_SUPERUSER: "1" },
              stdio: "inherit",
            });

            if (result.error) {
              throw result.error;
            }

            if (result.status !== 0) {
              process.exit(result.status || 1);
            }
          }
          NODE

      - name: Clean up before retry
        if: steps.test-run.outcome == 'failure'
        run: |
          # First attempt and retry share this container; a hard timeout can
          # orphan processes (EADDRINUSE) and temp dirs. The retry recreates
          # each app fresh, so only container leftovers need clearing.
          echo "Cleaning up after the failed attempt..."
          pkill -9 -f 'meteortest-' || true
          # Detached bundler/db children may not carry the temp path in argv.
          pkill -9 -f mongod || true
          pkill -9 -f rspack || true
          rm -rf /tmp/meteortest-* /tmp/meteor-build-* || true
          sleep 3
          echo "Cleanup done."

      - name: Retry failed tests for ${{ matrix.check }}
        if: steps.test-run.outcome == 'failure'
        timeout-minutes: 20
        env:
          JEST_ARGS_JSON: ${{ matrix.jestArgsJson }}
        run: |
          echo "::warning::First attempt failed, retrying..."
          node - <<'NODE'
          const { spawnSync } = require("child_process");

          function splitArgs(input) {
            const tokens = [];
            let token = "";
            let quote = null;

            for (let index = 0; index < input.length; index += 1) {
              const char = input[index];

              if (char === "\\") {
                const next = input[index + 1];
                if (quote && (next === quote || next === "\\")) {
                  token += next;
                  index += 1;
                } else if (!quote && next && (/[\s"'\\]/).test(next)) {
                  token += next;
                  index += 1;
                } else {
                  token += char;
                }
                continue;
              }

              if (quote) {
                if (char === quote) {
                  quote = null;
                } else {
                  token += char;
                }
                continue;
              }

              if (char === "\"" || char === "'") {
                quote = char;
                continue;
              }

              if (/\s/.test(char)) {
                if (token) {
                  tokens.push(token);
                  token = "";
                }
                continue;
              }

              token += char;
            }

            if (quote) {
              throw new Error(`Unclosed ${quote} quote in Jest args: ${input}`);
            }

            if (token) {
              tokens.push(token);
            }

            return tokens;
          }

          const argsList = JSON.parse(process.env.JEST_ARGS_JSON);
          for (const args of argsList) {
            const result = spawnSync("npm", ["run", "test:e2e", "--", ...splitArgs(args)], {
              env: { ...process.env, METEOR_ALLOW_SUPERUSER: "1" },
              stdio: "inherit",
            });

            if (result.error) {
              throw result.error;
            }

            if (result.status !== 0) {
              process.exit(result.status || 1);
            }
          }
          NODE

  test-skipped:
    name: ${{ matrix.check }}
    needs: e2e_gate
    if: needs.e2e_gate.outputs.noop_count != '0' && needs.e2e_gate.outputs.emit_checks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e_gate.outputs.noop_matrix) }}
    steps:
      - name: Skip E2E tests
        env:
          E2E_SKIP_REASON: ${{ needs.e2e_gate.outputs.reason }}
        run: |
          echo "Skipping ${{ matrix.check }} E2E tests: ${E2E_SKIP_REASON}"
