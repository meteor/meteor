name: Run a Linux check in Docker

# The caller supplies a Docker image and a command, for example npm run test:unit.
# This workflow selects the Linux runner and runs that command as a single job.
# The E2E suites define their own job containers for browser setup and retries.
#
# The oss-vm machines reuse their workspaces. Copying a fresh checkout into the
# container keeps node_modules and build output on its disposable filesystem.
# Cleanup removes the container, the host checkout and any temporary npm cache
# archive. Callers can reuse npm downloads through the Actions cache.
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      command:
        type: string
        required: true
      self-hosted-in-public:
        description: Use Meteor's own runners for trusted jobs in the public repository.
        type: boolean
        default: false
      directory:
        type: string
        default: .
      timeout-minutes:
        type: number
        default: 360
      npm-lockfile:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    # The public repository uses standard GitHub runners for small checks and fork PRs.
    # Other repositories supply their own workers. Fork PRs need an isolated pool.
    runs-on: >-
      ${{ github.repository == 'meteor/meteor'
          && (!inputs.self-hosted-in-public ||
              (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
          && 'ubuntu-latest'
          || fromJSON(format('["self-hosted","linux",{0}]', toJSON(
               (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
               && (vars.METEOR_CI_FORK_LINUX_RUNNER || 'meteor-fork-ci')
               || vars.METEOR_CI_LINUX_RUNNER || 'oss-vm'))) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the check directory
        run: |
          # Reclaim this runner's previous checkout if it disconnected before cleanup.
          rm -rf -- .ci-linux-check
          mkdir .ci-linux-check

      - uses: actions/checkout@v6
        with:
          path: .ci-linux-check/source
          persist-credentials: false

      - name: Restore npm downloads
        id: cache
        if: inputs.npm-lockfile != ''
        uses: actions/cache/restore@v5
        with:
          path: .ci-linux-check/npm-downloads.tar
          key: npm-check-${{ inputs.image }}-${{ hashFiles(format('.ci-linux-check/source/{0}', inputs.npm-lockfile)) }}

      - name: Start check container
        id: container
        env:
          IMAGE: ${{ inputs.image }}
          TIMEOUT: ${{ inputs.timeout-minutes }}
        run: |
          # The daemon also removes the container if a runner disappears and the job times out.
          id=$(docker run --detach --rm --init --user node --cap-drop=ALL --security-opt=no-new-privileges \
            --env CI=true --env GITHUB_ACTIONS --env GITHUB_SHA --env GITHUB_REF --env GITHUB_REPOSITORY \
            --env HOME=/home/node --env GITHUB_WORKSPACE=/home/node/source --env GITHUB_STEP_SUMMARY=/tmp/step-summary \
            "$IMAGE" sleep "${TIMEOUT}m")
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Copy checkout into container
        env:
          CONTAINER: ${{ steps.container.outputs.id }}
        run: |
          docker exec "$CONTAINER" mkdir -p /home/node/source /home/node/.npm
          tar -C .ci-linux-check/source -cf - . | docker exec -i "$CONTAINER" tar -C /home/node/source -xf -

      - name: Load cached downloads
        if: steps.cache.outputs.cache-hit == 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.id }}
        run: docker exec -i "$CONTAINER" tar -C /home/node/.npm -xf - < .ci-linux-check/npm-downloads.tar

      - name: Run check
        env:
          CONTAINER: ${{ steps.container.outputs.id }}
          DIRECTORY: ${{ inputs.directory }}
          COMMAND: ${{ inputs.command }}
        run: |
          result=0
          docker exec --workdir "/home/node/source/$DIRECTORY" "$CONTAINER" bash -eo pipefail -c "$COMMAND" || result=$?
          docker exec "$CONTAINER" sh -c 'if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat "$GITHUB_STEP_SUMMARY"; fi' >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Export npm downloads
        if: inputs.npm-lockfile != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.id }}
        run: docker exec "$CONTAINER" tar -C /home/node/.npm -cf - _cacache > .ci-linux-check/npm-downloads.tar

      - name: Save npm downloads
        if: inputs.npm-lockfile != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci-linux-check/npm-downloads.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Remove check container
        if: always() && steps.container.outputs.id != ''
        env:
          CONTAINER: ${{ steps.container.outputs.id }}
        run: |
          existing=$(docker ps -aq --filter "id=$CONTAINER")
          if [ -n "$existing" ]; then
            docker rm --force --volumes "$CONTAINER"
          fi

      - name: Remove the check directory
        if: always()
        run: rm -rf -- .ci-linux-check
