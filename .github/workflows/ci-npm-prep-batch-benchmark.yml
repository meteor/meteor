name: CI npm preparation benchmark

# Temporary, controlled benchmark for PR #14683. It checks out an exact
# commit and intentionally does not restore a cache, so every run measures the
# cold `meteor --get-ready` path used to prepare npm dependencies.
run-name: CI npm preparation benchmark (${{ github.sha }})

on:
  push:
    branches:
      - codex/ci-benchmark-devel
    paths:
      - ".github/workflows/ci-npm-prep-batch-benchmark.yml"

env:
  TIMEOUT_SCALE_FACTOR: 8
  METEOR_SELF_TEST_RETRIES: 2
  METEOR_HEADLESS: true
  METEOR_PRETTY_OUTPUT: 0
  METEOR_SAVE_TMPDIRS: 1
  SELF_TEST_EXCLUDE: "add debugOnly and prodOnly packages"
  SELF_TEST_TOOL_NODE_FLAGS: " "
  METEOR_MODERN: true
  CXX: g++-12
  METEOR_ALLOW_SUPERUSER: 1
  BENCHMARK_LABEL: p83-pr-6
  COMMIT_SHA: 1d0a3f01744a750446425b4fa5bee1cc31c83e3e

permissions:
  contents: read

concurrency:
  group: ci-npm-prep-batch-benchmark
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Meteor (controlled cache miss)
    runs-on: oss-vm
    container:
      image: meteor/circleci:2025.07.8-android-35-node-22
      options: --init --user root
    timeout-minutes: 75
    steps:
      - name: Validate benchmark inputs
        env:
          BENCHMARK_LABEL: ${{ env.BENCHMARK_LABEL }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a lowercase 40-character SHA" >&2
            exit 1
          }
          [[ "$BENCHMARK_LABEL" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || {
            echo "benchmark_label must be lowercase letters, digits, or hyphens" >&2
            exit 1
          }

      - name: Checkout benchmark commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Expose globally-installed puppeteer to Node.js
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Prepare Meteor
        timeout-minutes: 65
        run: ./meteor --get-ready

      - name: Record benchmark configuration
        env:
          BENCHMARK_LABEL: ${{ env.BENCHMARK_LABEL }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          {
            echo "### Controlled npm preparation benchmark"
            echo "- Label: \`$BENCHMARK_LABEL\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Cache restore: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
