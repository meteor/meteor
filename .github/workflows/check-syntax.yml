name: Check legacy syntax
on:
  - pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  check-code-style:
    uses: ./.github/workflows/linux-check.yml
    with:
      image: node:26-bookworm
      directory: scripts/admin/check-legacy-syntax
      command: |
        npm ci
        node check-syntax.js
