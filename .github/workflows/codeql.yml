name: CodeQL

on:
  push:
    branches:
      - devel
      - release-3.6
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # Opt in after reviewing the initial findings and agreeing on the public rollout.
    if: github.repository == 'meteor/meteor' && vars.METEOR_CODEQL_ENABLED == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Initialize CodeQL with the default query suite
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4, resolved 2026-10-29
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
          upload: always
          upload-database: false
