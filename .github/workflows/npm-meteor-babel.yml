name: NPM meteor-babel
on:
  push:
    paths:
      - "npm-packages/meteor-babel/**"
  pull_request:
    paths:
      - "npm-packages/meteor-babel/**"

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  test:
    uses: ./.github/workflows/linux-check.yml
    with:
      image: node:26-bookworm
      directory: npm-packages/meteor-babel
      npm-lockfile: npm-packages/meteor-babel/package-lock.json
      command: |
        npm ci
        npm run test
