# Area labels applied to pull requests from the paths they change (actions/labeler).
# Areas are defined in .github/labels.yml and explained in LABELS.md.

"area: accounts":
  - changed-files:
      - any-glob-to-any-file:
          - packages/accounts-*/**
          - packages/oauth*/**
          - packages/*-oauth/**
          - packages/*-config-ui/**
          - packages/service-configuration/**
          - packages/roles/**
          - packages/sha/**
          - packages/localstorage/**
          - packages/deprecated/{facebook,github,google,meetup,meteor-developer,twitter,weibo,srp,npm-bcrypt}/**

"area: blaze":
  - changed-files:
      - any-glob-to-any-file:
          - packages/non-core/blaze
          - packages/non-core/blaze/**
          - packages/non-core/jquery/**

"area: build":
