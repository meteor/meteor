<template name="configureLoginServiceDialogForMeteorDeveloper">
  <p>
    First, you'll need to get a Meteor developer account Client ID.
    Follow these steps:
  </p>
  <ol>
    <li>
      Visit <a href="https://my.galaxycloud.app/" target="_blank">https://my.galaxycloud.app/</a> and sign in.
    </li>
    <li>
      Go to "Settings" -> "API &amp; Integrations" -> "Authorized Domains" and add a domain.
    </li>
    <li>
      Enter an "App Name" and set the "Redirect URI" to: <span class="url">{{siteUrl}}_oauth/meteor-developer</span>
    </li>
    <li>
      Click "Add Domain" and note down the "Client ID" and "Secret" shown for it.
    </li>
  </ol>
</template>
