appId: com.meteor.capacitortests
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Meteor Capacitor Tests"
- assertVisible: "Native render ready"
- assertVisible: "Style preserved"
- extendedWaitUntil:
    visible: "DDP verified"
    timeout: 60000
- assertVisible: "Native client version initial"
- assertVisible: "Native server version initial"
- assertVisible: "window.Capacitor available"
- assertVisible: "Meteor.isCapacitor true"
- assertVisible: "Capacitor native platform ready"
- assertVisible: "WebAppLocalServer shim ready"
- assertVisible: "WebAppLocalServer livereload shim ready"
- assertVisible: "__cordova paths adapted"
