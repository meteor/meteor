<head>
  <title>~name~</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<template name="layout">
  <nav>
    <a href="{{pathFor 'home'}}">Home</a>
    <a href="{{pathFor 'about'}}">About</a>
  </nav>

  {{> yield}}
</template>

<template name="home">
  <h1>Welcome to Meteor!</h1>

  {{> hello}}
  {{> info}}
</template>

<template name="about">
  <h1>About Page</h1>

  <p>This is the about page.</p>
</template>

<template name="hello">
  <button>Click Me</button>
  <p>You've pressed the button {{counter}} times.</p>
</template>

<template name="info">
  <h2>Learn Meteor!</h2>
  <ul>
    <li><a href="https://docs.meteor.com/tutorials/blaze/" target="_blank">Do the Tutorial</a></li>
    <li><a href="https://docs.meteor.com/tutorials/application-structure/" target="_blank">Follow the Guide</a></li>
    <li><a href="https://docs.meteor.com" target="_blank">Read the Docs</a></li>
    <li><a href="https://forums.meteor.com" target="_blank">Discussions</a></li>
  </ul>
</template>
