<head>
  <title>~name~</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA: web app manifest + install metadata. Makes the app installable. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ff6b35">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

<body>
  <h1>Welcome to Meteor!</h1>

  {{> installPrompt}}
  {{> hello}}
  {{> info}}
</body>

<!-- PWA: shows an install button when the browser fires `beforeinstallprompt`
     (Chromium only; Safari/Firefox use their own install UI). -->
<template name="installPrompt">
  {{#if canInstall}}
    <button class="pwa-install" type="button">Install app</button>
  {{/if}}
</template>

<template name="hello">
  <button>Click Me</button>
  <p>You've pressed the button {{counter}} times.</p>
</template>

<template name="info">
  <h2>Learn Meteor!</h2>
  <ul>
    <li><a href="https://www.meteor.com/try" target="_blank">Do the Tutorial</a></li>
    <li><a href="http://guide.meteor.com" target="_blank">Follow the Guide</a></li>
    <li><a href="https://docs.meteor.com" target="_blank">Read the Docs</a></li>
    <li><a href="https://forums.meteor.com" target="_blank">Discussions</a></li>
  </ul>
</template>
