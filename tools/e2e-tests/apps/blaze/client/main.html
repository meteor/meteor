<head>
  <title>blaze</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>Welcome to Meteor!</h1>

  {{> hello}}
  {{> info}}
  {{> eventScopeCollisionParent}}
  {{> eventScopeDirectParent}}
</body>

<template name="hello">
  <button>Click Me</button>
  <p>You've pressed the button {{counter}} times.</p>
</template>

<!-- Reproductions of meteor/blaze#512. Keep the wrapper and block-helper
     nesting: both affect the native backend's delegated event scope. -->
<template name="eventScopeCollisionParent">
  {{#if show}}
    <div id="event-scope-collision">{{> eventScopeCollisionChild}}</div>
  {{/if}}
</template>

<template name="eventScopeCollisionChild">
  {{#if show}}
    <nav><button type="button" class="js-hit">Nested click</button></nav>
  {{/if}}
  <output class="event-count">{{count}}</output>
  <output class="event-target">{{currentTarget}}</output>
</template>

<template name="eventScopeDirectParent">
  <div id="event-scope-direct">{{> eventScopeDirectChild}}</div>
</template>

<template name="eventScopeDirectChild">
  {{#if show}}
    <button type="button" class="js-hit">Direct click</button>
  {{/if}}
  <output class="event-count">{{count}}</output>
  <output class="event-target">{{currentTarget}}</output>
</template>

<template name="info">
  <h2>Learn Meteor!</h2>
  <ul>
    <li><a href="https://www.meteor.com/try" target="_blank">Do the Tutorial</a></li>
    <li><a href="http://guide.meteor.com" target="_blank">Follow the Guide</a></li>
    <li><a href="https://docs.meteor.com" target="_blank">Read the Docs</a></li>
    <li><a href="https://forums.meteor.com" target="_blank">Discussions</a></li>
  </ul>
</template>
