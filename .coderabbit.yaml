# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

reviews:
  profile: "chill"                      # community repo — keep it welcoming
  request_changes_workflow: false
  high_level_summary: true
  poem: false                           # serious OSS platform
  in_progress_fortune: false            # noise
  review_status: false
  review_details: false
  commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false              # overkill for package-level PRs
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  labeling_instructions:            # one type, one or more areas; see LABELS.md
    - label: "type: bug"
      instructions: "Something does not work as documented or as it used to."
    - label: "type: feature"
      instructions: "New behavior or capability."
    - label: "type: docs"
      instructions: "Documentation is missing, wrong or unclear."
    - label: "type: maintenance"
      instructions: "CI, tooling, dependencies or refactors without behavior change; add an area label only when the change sits in one."
    - label: "type: security"
      instructions: "Security hardening; report vulnerabilities privately, see SECURITY.md."
    - label: "area: accounts"
      instructions: "Accounts, password, passwordless, 2FA, OAuth and login services, roles."
    - label: "area: blaze"
      instructions: "Blaze integration in this repository (Blaze itself lives in meteor/blaze)."
    - label: "area: build"
      instructions: "Isobuild, compilers, minifiers, modules, HMR, CSS, Babel and SWC."
    - label: "area: cli"
      instructions: "The meteor command: tool, shell, installer and version solver."
    - label: "area: core"
      instructions: "Runtime packages: meteor, core-runtime, EJSON, check, logging, random."
    - label: "area: create"
      instructions: "meteor create, skeletons and example apps."
    - label: "area: ddp"
      instructions: "DDP client and server, transports, methods and subscriptions."
    - label: "area: docs"
      instructions: "Only when the PR changes documentation (docs/, v3-docs/, guide/, Markdown files) and nothing else."
    - label: "area: instrumentation"
      instructions: "Instrumentation and OpenTelemetry (roadmap front, folds into core afterwards)."
    - label: "area: livequery"
      instructions: "Oplog, change streams and the observe drivers."
    - label: "area: minimongo"
      instructions: "Minimongo: client collections, selectors, modifiers, observe."
    - label: "area: mobile"
      instructions: "Cordova, Capacitor, iOS and Android builds."
    - label: "area: mongo"
      instructions: "Mongo collections and driver, allow/deny, npm-mongo."
    - label: "area: offline"
      instructions: "Offline package and PWA skeleton (roadmap front, folds into webapp afterwards)."
    - label: "area: packages"
      instructions: "Other core packages: email, fetch, url, imported packages."
    - label: "area: reactivity"
      instructions: "Tracker, reactive-var, reactive-dict, session."
    - label: "area: release"
      instructions: "Release process, packaging and version bumps."
    - label: "area: rspack"
      instructions: "Rspack bundler integration (the modern build stack)."
    - label: "area: testing"
      instructions: "Test harness: tinytest, test-in-*, e2e (not the self-tests of a CLI change)."
    - label: "area: types"
      instructions: "TypeScript declarations and type tests."
    - label: "area: webapp"
      instructions: "Webapp, boilerplate, browser policy, autoupdate, server rendering."
    - label: "platform: windows"
      instructions: "Specific to Windows."
    - label: "experimental"
      instructions: "Exploratory change or proof of concept that the author does not expect to merge as is."
  suggested_reviewers: true
  auto_assign_reviewers: false

  # Exclude generated, build, and Meteor-internal files
  path_filters:
    - "!**/node_modules/**"
    - "!**/.meteor/**"
    - "!**/bundle/**"
    - "!**/programs/**"
    - "!**/*.min.js"
    - "!**/cordova-build/**"
    - "!**/package-lock.json"

  path_instructions:
    - path: "packages/**"
      instructions: >
        This is a core Meteor Atmosphere package. Focus on API backwards
        compatibility, DDP/reactivity correctness, and client/server split.
        Avoid nitpicking style — the codebase has legacy patterns.
    - path: "tools/**"
      instructions: >
        This is the Meteor build tool (Isobuild). Be thorough about
        correctness, edge cases, and performance in the CLI/build pipeline.
    - path: "npm-packages/**"
      instructions: >
        These are npm packages published from the Meteor monorepo.
        Check for correct exports, peer dependency handling, and Node.js compatibility.
    - path: "v3-docs/**"
      instructions: >
        Documentation for Meteor v3. Check for accuracy, clarity, and
        correct code examples. Grammar and spelling matter here.
    - path: "scripts/**"
      instructions: >
        Build and CI scripts. Focus on correctness, portability, and
        error handling.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 3
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    base_branches: []

  finishing_touches:
    docstrings:
      enabled: false    # legacy JS — too much noise across 100s of packages
    unit_tests:
      enabled: true
    simplify:
      enabled: false

  tools:
    shellcheck:
      enabled: true       # ✅ they have .sh scripts in /scripts
    markdownlint:
      enabled: true       # ✅ heavy docs contribution
    languagetool:
      enabled: true       # ✅ useful for international doc contributors
      level: "default"
      disabled_categories:
        - "TYPOGRAPHY"    # too nitpicky for code comments
    ruff:
      enabled: false      # ❌ not a Python project
    biome:
      enabled: false      # ❌ they use ESLint already (.eslintignore exists)
    ast-grep:
      essential_rules: true

chat:
  auto_reply: true
