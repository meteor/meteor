# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

reviews:
  profile: "chill"                      # community repo, keep it welcoming
  request_changes_workflow: false
  high_level_summary: true
  poem: false                           # serious OSS platform
  in_progress_fortune: false            # noise
  review_status: false
  review_details: false
  commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false              # overkill for package-level PRs
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: true
  labeling_instructions:
    - label: "ci:e2e"
      instructions: >
        Apply when the PR broadly affects Meteor E2E CI, Meteor tool behavior,
        E2E test coverage, or multiple E2E categories, including changes under
        meteor, meteor/**, packages/meteor-tool/**, tools/cli/**,
        tools/isobuild/**, shared E2E infrastructure files under
        tools/e2e-tests/**, or .github/workflows/e2e-tests.yml. This label
        runs all E2E checks and should be treated as a sticky
        manual-compatible label. Do not apply for docs-only or unrelated
        package, frontend, or backend changes unless they affect E2E
        execution, coverage, fixtures, or Meteor tool behavior.
    - label: "ci:e2e:apps"
      instructions: >
        Apply when the PR affects app lifecycle or bundling checks for existing
        E2E fixture apps, including tools/e2e-tests/apps/**, generated app
        startup, hot reload, rebuild behavior, Rspack integration, build
        output, test mode, production mode, DDP connection smoke checks, or
        Meteor tool changes likely to affect generated app execution. Do not
        apply for docs-only or unrelated package, frontend, or backend changes
        unless they affect app E2E execution, fixtures, or coverage.
    - label: "ci:e2e:skeletons"
      instructions: >
        Apply when the PR affects meteor create skeleton behavior, skeleton
        source assets under tools/static-assets/skel-**, skeleton creation,
        skeleton run, test, or build behavior, skeleton package contents, or
        tools/e2e-tests/skeleton.test.js. Do not apply for docs-only or
        unrelated package, frontend, or backend changes unless they affect
        skeleton E2E execution, assets, or coverage.
    - label: "ci:e2e:examples"
      instructions: >
        Apply when the PR affects Meteor example creation, meteor create
        --list, meteor create --example, meteor create --from, example
        repository integration, generated example execution, or
        tools/e2e-tests/example.test.js. Do not apply for docs-only or
        unrelated package, frontend, or backend changes unless they affect
        example E2E execution, fixtures, or coverage.
    - label: "ci:e2e:native"
      instructions: >
        Apply when the PR affects native mobile smoke tests, Cordova app build
        behavior, iOS or Android simulator setup, Maestro flows,
        tools/native-tests/**, .github/workflows/native.yml, mobile smoke
        checks, tools/native-tests workflow support, native test stability, or
        native workflow behavior. Do not apply for docs-only or unrelated
        package, frontend, or backend changes unless they affect native E2E
        execution, smoke tests, or coverage.
  suggested_reviewers: true
  auto_assign_reviewers: false

  # Exclude generated, build, and Meteor-internal files
  path_filters:
    - "!**/node_modules/**"
    - "!**/.meteor/**"
    - "!**/bundle/**"
    - "!**/programs/**"
    - "!**/*.min.js"
    - "!**/cordova-build/**"
    - "!**/package-lock.json"

  path_instructions:
    - path: "packages/**"
      instructions: >
        This is a core Meteor Atmosphere package. Focus on API backwards
        compatibility, DDP/reactivity correctness, and client/server split.
        Avoid nitpicking style, the codebase has legacy patterns.
    - path: "tools/**"
      instructions: >
        This is the Meteor build tool (Isobuild). Be thorough about
        correctness, edge cases, and performance in the CLI/build pipeline.
    - path: "npm-packages/**"
      instructions: >
        These are npm packages published from the Meteor monorepo.
        Check for correct exports, peer dependency handling, and Node.js compatibility.
    - path: "v3-docs/**"
      instructions: >
        Documentation for Meteor v3. Check for accuracy, clarity, and
        correct code examples. Grammar and spelling matter here.
    - path: "scripts/**"
      instructions: >
        Build and CI scripts. Focus on correctness, portability, and
        error handling.

  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 3
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    base_branches: []

  finishing_touches:
    docstrings:
      enabled: false    # legacy JS, too much noise across 100s of packages
    unit_tests:
      enabled: true
    simplify:
      enabled: false

  tools:
    shellcheck:
      enabled: true       # ✅ they have .sh scripts in /scripts
    markdownlint:
      enabled: true       # ✅ heavy docs contribution
    languagetool:
      enabled: true       # ✅ useful for international doc contributors
      level: "default"
      disabled_categories:
        - "TYPOGRAPHY"    # too nitpicky for code comments
    ruff:
      enabled: false      # ❌ not a Python project
    biome:
      enabled: false      # ❌ they use ESLint already (.eslintignore exists)
    ast-grep:
      essential_rules: true

chat:
  auto_reply: true
